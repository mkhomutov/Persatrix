schema_version: "0.1"

workflow:
  id: "cycle-complex"
  name: "Complex Cycle"
  trigger: "manual"

  steps:
    - id: "aa"
      agent: "planner"
      input: "start"
      depends_on: ["cc"]

    - id: "bb"
      agent: "planner"
      input: "middle"
      depends_on: ["aa"]

    - id: "cc"
      agent: "planner"
      input: "loop back"
      depends_on: ["bb"]

    - id: "dd"
      agent: "planner"
      input: "depends on cycle"
      depends_on: ["cc", "bb"]
