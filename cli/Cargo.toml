[package]
name = "persatrix"
version = "0.3.10"
edition = "2021"
description = "Persatrix CLI — manage agents, workflows, and the mesh"
license = "BUSL-1.1"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "full" pulls every Tokio sub-crate (io_uring, fs …).
# Only enable features actually used: runtime, macros, process (async subprocess
# for validate command), time (subprocess timeout).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal"] }
# `stream` feature exposes `reqwest::Response::bytes_stream()`, which the
# `persatrix logs --follow` SSE client (cli/src/commands/logs.rs) consumes.
reqwest = { version = "0.12", features = ["json", "stream"] }
colored = "2"
ctrlc = "3"                       # graceful Ctrl-C handling for chat REPL
tabled = "0.20"                   # table output formatting
# Home-directory resolution for the `~/.persatrix/active-session` pointer file
# (RFC 0031 Phase 3 §E). The only cross-platform homedir API; std has none.
dirs = "5"
# Async stream combinators (StreamExt::next) for the SSE follow loop.
# Already pulled in transitively by reqwest; declared here so cli/src code can
# `use futures_util::StreamExt` without depending on a transitive surface.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# YAML for the RFC 0050 `channel config export/import/diff` verbs
# (cli/src/commands/channel_config_yaml.rs) — read the declared
# `config/channels.yaml` per-channel block and regenerate it from the store.
# serde_yaml is deprecated and serde_yml is now unmaintained/unsound
# (RUSTSEC, via libyml). serde_yaml_ng is the maintained drop-in fork.
serde_yaml_ng = "0.10"

# Removed in PR review: tonic (gRPC — not used, CLI uses REST via reqwest),
# indicatif (no progress bars yet). Re-add each when the corresponding feature
# is implemented.
# SSE parsing is implemented inline in cli/src/commands/logs.rs against the
# server's narrow contract (`data: <json>\n\n` + `: heartbeat\n\n`); a full
# eventsource crate would be overkill for the two frame shapes in use.

[dev-dependencies]
# Isolated temp directories for the active-session pointer-file tests, so they
# never touch the real `~/.persatrix/`. Already in the dependency graph
# transitively; declared here for direct test use.
tempfile = "3"
