[package]
name = "persatrix"
version = "0.3.0"
edition = "2021"
description = "Persatrix CLI — manage agents, workflows, and the mesh"
license = "BUSL-1.1"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# "full" pulls every Tokio sub-crate (io_uring, fs …).
# Only enable features actually used: runtime, macros, process (async subprocess
# for validate command), time (subprocess timeout).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "signal"] }
# `stream` feature exposes `reqwest::Response::bytes_stream()`, which the
# `persatrix logs --follow` SSE client (cli/src/commands/logs.rs) consumes.
reqwest = { version = "0.12", features = ["json", "stream"] }
colored = "2"
ctrlc = "3"                       # graceful Ctrl-C handling for chat REPL
tabled = "0.20"                   # table output formatting
# Async stream combinators (StreamExt::next) for the SSE follow loop.
# Already pulled in transitively by reqwest; declared here so cli/src code can
# `use futures_util::StreamExt` without depending on a transitive surface.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Removed in PR review: tonic (gRPC — not used, CLI uses REST via reqwest),
# serde_yml (no YAML parsing yet), indicatif (no progress bars yet).
# Re-add each when the corresponding feature is implemented.
# SSE parsing is implemented inline in cli/src/commands/logs.rs against the
# server's narrow contract (`data: <json>\n\n` + `: heartbeat\n\n`); a full
# eventsource crate would be overkill for the two frame shapes in use.
