# An id that ends in a line break. Python's `$` matches before a final
# newline; `agents/validate.py` reads it as the end of the text, as Go does.
organizations:
  - id: "acme\n"
    name: Acme
    topology: flat
    roles: [{id: member, authority: peer}]
    members:
      - {agent_id: ember-owl, role: member}
