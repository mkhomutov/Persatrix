syntax = "proto3";

package persatrix.v1;

option go_package = "github.com/persatrix/persatrix/internal/generated/msgpb";

// ─── Agent Communication (agent ↔ agent via channels) ──────
// This schema is used in v0.2+ for inter-agent messaging.

service ChannelService {
  // Send a message to a channel or DM.
  rpc SendMessage(AgentMessage) returns (SendMessageResponse);

  // Subscribe to messages in a channel (server-side streaming).
  rpc Subscribe(SubscribeRequest) returns (stream AgentMessage);
}

message AgentMessage {
  string message_id = 1;
  string channel_id = 2;
  string sender_id = 3;
  string thread_id = 4;                  // empty if top-level message
  MessageType type = 5;
  string content = 6;                    // natural language message body
  repeated Attachment attachments = 7;
  repeated string mentions = 8;          // agent IDs mentioned with @
  string reply_to = 9;                   // message_id being replied to
  Visibility visibility = 10;
  int64 timestamp = 11;
}

enum MessageType {
  TEXT = 0;
  DECISION = 1;
  QUESTION = 2;
  TASK_ASSIGN = 3;
  STATUS_UPDATE = 4;
  ESCALATION = 5;
  APPROVAL_REQ = 6;
  APPROVAL_RESP = 7;
  SOCIAL = 8;
}

enum Visibility {
  CHANNEL = 0;
  PRIVATE = 1;
  CONFIDENTIAL = 2;
}

message Attachment {
  string filename = 1;
  string mime_type = 2;
  bytes content = 3;
}

message SendMessageResponse {
  string message_id = 1;
  bool delivered = 2;
}

message SubscribeRequest {
  string channel_id = 1;
  string agent_id = 2;
  int64 since_timestamp = 3;             // replay messages after this time
}
