syntax = "proto3";

package persatrix.v1;

option go_package = "github.com/mkhomutov/persatrix/internal/generated/taskpb";

// ─── Task Execution (orchestrator ↔ agent) ─────────────────

service AgentService {
  // Execute a task on the agent and return the result.
  rpc ExecuteTask(TaskRequest) returns (TaskResponse);

  // Stream task progress (for long-running tasks).
  rpc ExecuteTaskStream(TaskRequest) returns (stream TaskProgress);

  // Health check (grpc.health.v1 compatible).
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Send a chat message to the agent and return a synchronous reply.
  rpc SendChatMessage(ChatRequest) returns (ChatResponse);

  // Deliver a channel message event to a subscribed agent (RFC 0011 §C).
  rpc ReceiveChannelMessage(ChannelMessageEvent) returns (TaskAck);
}

message TaskRequest {
  string task_id = 1;
  string workflow_id = 2;
  string agent_id = 3;
  string payload = 4;                    // natural language task description
  map<string, string> context = 5;       // outputs from prior workflow steps
  TaskConfig config = 6;
}

message TaskConfig {
  int32 max_llm_calls = 1;
  int32 max_tokens = 2;
  int32 timeout_seconds = 3;
  repeated string allowed_tools = 4;     // tool whitelist for this task
}

message TaskResponse {
  string task_id = 1;
  TaskStatus status = 2;
  string result = 3;
  map<string, string> metadata = 4;      // tokens_used, duration_ms, etc.
  string error_message = 5;              // populated if status == FAILED
}

message TaskProgress {
  string task_id = 1;
  TaskStatus status = 2;
  string message = 3;                    // human-readable progress update
  float progress_percent = 4;            // 0.0 – 1.0
  int64 timestamp = 5;
}

enum TaskStatus {
  PENDING = 0;
  RUNNING = 1;
  COMPLETED = 2;
  FAILED = 3;
  CANCELLED = 4;
  RETRYING = 5;
}

// ─── Health Check ──────────────────────────────────────────

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  HealthStatus status = 1;
}

enum HealthStatus {
  UNKNOWN = 0;
  SERVING = 1;
  NOT_SERVING = 2;
}

// ─── Human Chat (REST ↔ agent gRPC) ───────────────────────

message ChatRequest {
  string agent_id = 1;
  string user_id = 2;
  string message = 3;              // max 4000 chars enforced server-side
  string session_id = 4;           // empty → server generates UUID; max 128 chars
  int32 timeout_seconds = 5;       // 0 or negative → server default (30s); max 300s
  string participant_type = 6;     // defaults to "user" when empty
}

message ChatResponse {
  string reply = 1;
  string session_id = 2;
  string agent_id = 3;
  int64 timestamp = 4;            // Unix epoch seconds
  string agent_display_name = 5;  // populated by orchestrator from Registry
  string reply_status = 6;        // "ok" | "empty" | "error"
}

// ─── Channel Message Delivery (orchestrator → subscribed agent) ────
// RFC 0011 §C. Carries a single channel message to one subscriber.
// `channel_type` duplicates the prefix encoded in `channel_id`
// ("group:" / "dm:" / "thread:") and is carried separately for
// log/observability ergonomics — counters and span attributes use it
// without parsing. Orchestrator MUST validate agreement with the prefix
// on publish (Phase 2 `ChannelRouter`); receivers SHOULD drop on
// mismatch as malformed rather than pick one source.
message ChannelMessageEvent {
  string message_id = 1;
  string channel_id = 2;
  string channel_type = 3;        // "group" | "dm" | "thread"
  string sender_id = 4;
  string content = 5;
  string timestamp = 6;           // RFC 3339
  string thread_id = 7;           // empty string if not a reply
  repeated string mentions = 8;
}

// Generic ack returned by fire-and-acknowledge RPCs (e.g. ReceiveChannelMessage).
// At-most-once delivery in v0.3.0 — `success=false` signals the agent rejected
// or could not process the event; the orchestrator does not retry in this release.
message TaskAck {
  bool success = 1;
  string error_message = 2;       // populated when success == false
}
