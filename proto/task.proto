syntax = "proto3";

package persatrix.v1;

option go_package = "github.com/mkhomutov/persatrix/internal/generated/taskpb";

// ─── Task Execution (orchestrator ↔ agent) ─────────────────

service AgentService {
  // Execute a task on the agent and return the result.
  rpc ExecuteTask(TaskRequest) returns (TaskResponse);

  // Stream task progress (for long-running tasks).
  rpc ExecuteTaskStream(TaskRequest) returns (stream TaskProgress);

  // Health check (grpc.health.v1 compatible).
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Send a chat message to the agent and return a synchronous reply.
  rpc SendChatMessage(ChatRequest) returns (ChatResponse);

  // Deliver a channel message event to a subscribed agent (RFC 0011 §C).
  rpc ReceiveChannelMessage(ChannelMessageEvent) returns (TaskAck);
}

message TaskRequest {
  string task_id = 1;
  string workflow_id = 2;
  string agent_id = 3;
  string payload = 4;                    // natural language task description
  map<string, string> context = 5;       // outputs from prior workflow steps
  TaskConfig config = 6;
}

message TaskConfig {
  int32 max_llm_calls = 1;
  int32 max_tokens = 2;
  int32 timeout_seconds = 3;
  repeated string allowed_tools = 4;     // tool whitelist for this task
}

message TaskResponse {
  string task_id = 1;
  TaskStatus status = 2;
  string result = 3;
  map<string, string> metadata = 4;      // tokens_used, duration_ms, etc.
  string error_message = 5;              // populated if status == FAILED
}

message TaskProgress {
  string task_id = 1;
  TaskStatus status = 2;
  string message = 3;                    // human-readable progress update
  float progress_percent = 4;            // 0.0 – 1.0
  // Unix epoch seconds. NOTE: ChannelMessageEvent.timestamp is RFC 3339
  // string by deliberate exception (forwarded verbatim to the channel
  // store's messages.created_at column — see field doc). Do not
  // "harmonise" the two without re-reading that rationale. ISSUE-0022.
  int64 timestamp = 5;
}

enum TaskStatus {
  PENDING = 0;
  RUNNING = 1;
  COMPLETED = 2;
  FAILED = 3;
  CANCELLED = 4;
  RETRYING = 5;
}

// ─── Health Check ──────────────────────────────────────────

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  HealthStatus status = 1;
}

enum HealthStatus {
  UNKNOWN = 0;
  SERVING = 1;
  NOT_SERVING = 2;
}

// ─── Human Chat (REST ↔ agent gRPC) ───────────────────────

message ChatRequest {
  string agent_id = 1;
  string user_id = 2;
  string message = 3;              // max 4000 chars enforced server-side
  // RFC 0016 chat-conversation token. Renamed from `session_id` in v0.3.1
  // to disambiguate from RFC 0031's operator-namespace `session_id`
  // landing on channels/messages/episodes/relationships. Field number
  // unchanged (binary-proto consumers unaffected); JSON/proto-text
  // consumers must migrate. Resolves RFC 0031 OQ #8.
  string chat_session_id = 4;      // empty → server generates UUID; max 128 chars
  int32 timeout_seconds = 5;       // 0 or negative → server default (30s); max 300s
  string participant_type = 6;     // defaults to "user" when empty
}

message ChatResponse {
  string reply = 1;
  // RFC 0016 chat-conversation token; see ChatRequest.chat_session_id.
  string chat_session_id = 2;
  string agent_id = 3;
  // Unix epoch seconds. NOTE: ChannelMessageEvent.timestamp is RFC 3339
  // string by deliberate exception (forwarded verbatim to the channel
  // store's messages.created_at column — see field doc). Do not
  // "harmonise" the two without re-reading that rationale. ISSUE-0022.
  int64 timestamp = 4;
  string agent_display_name = 5;  // populated by orchestrator from Registry
  string reply_status = 6;        // "ok" | "empty" | "error"
}

// ─── Channel Message Delivery (orchestrator → subscribed agent) ────
// RFC 0011 §C. Carries a single channel message to one subscriber.
// `channel_type` duplicates the prefix encoded in `channel_id`
// ("group:" / "dm:" / "thread:") and is carried separately for
// log/observability ergonomics — counters and span attributes use it
// without parsing. Orchestrator MUST validate agreement with the prefix
// on publish (Phase 2 `ChannelRouter`); receivers MUST drop on mismatch
// as malformed rather than pick one source (deny-by-default per
// `.github/copilot-instructions.md`; PR #246 deep review security
// finding — tightened from prior "SHOULD"). Receiver-side enforcement
// lives in `agents/channel_validation.py::validate_channel_message_event`
// (RFC 0011 PR 4a-i, #248).
message ChannelMessageEvent {
  // UUID v4 generated by the orchestrator's ChannelRouter on publish.
  // Receivers MUST NOT assume any other format; future versions may
  // switch to ULID or another monotonic scheme. PR #246 review NTH3.
  string message_id = 1;
  string channel_id = 2;
  string channel_type = 3;        // "group" | "dm" | "thread"
  // Orchestrator-authoritative: populated from the orchestrator's
  // authenticated agent registry on publish. Receivers MUST NOT trust
  // this field over a non-mTLS transport; in v0.3.0 the gRPC port is
  // cleartext and assumed local-only (see `agents/server.py` TLS TODO).
  // PR #246 deep review security finding (sender-spoofing trust boundary).
  string sender_id = 4;
  // Free-form user/agent text. Max 4000 chars enforced server-side
  // (mirrors `ChatRequest.message`); receivers MUST reject longer
  // payloads. May contain PII — handlers MUST NOT log `content` at
  // INFO/DEBUG without redaction. PR #246 deep review M1.
  string content = 5;
  // RFC 3339 string (NOT Unix epoch like ChatResponse.timestamp /
  // TaskProgress.timestamp). Chosen because the value is forwarded
  // verbatim to the channel store's `messages.created_at` column
  // (SQLite TEXT/DATETIME, RFC 0011 §A) — using `int64` here would
  // force a server-side format conversion on every publish purely to
  // satisfy the wire shape. Receivers MUST treat malformed timestamps
  // as a drop reason. See PR #246 deep review finding M4.
  string timestamp = 6;
  // Empty string if not a reply. Max 128 chars when set (mirrors
  // `ChatRequest.chat_session_id` bound). PR #246 deep review M1.
  string thread_id = 7;
  // Max 10 entries per event (mirrors `_MAX_MENTIONS_PER_ACTION` in
  // `agents/dispatch.py`); each entry is an agent_id constrained by
  // the canonical pattern `^[a-z0-9][a-z0-9-]*[a-z0-9]$`. Receivers
  // MUST reject over-cap or pattern-violating entries to bound fan-out
  // cost and preserve ID hygiene. Tracked at REST boundary by
  // `docs/issues/ISSUE-0011`. PR #246 deep review M1.
  repeated string mentions = 8;
  // RFC 0011 PR 4b: per-recipient response policy carried so the
  // agent-side gate can decide pre-LLM whether to suppress without an
  // extra REST roundtrip. Values: "when_mentioned" | "always". The
  // orchestrator MUST NOT dispatch to a `respond: never` member at all
  // (filtered upstream in `ChannelRouter.fanout`); receivers therefore
  // MUST treat `respond_policy="never"` on the wire as malformed.
  // Empty is also malformed — every dispatch must carry the recipient's
  // policy. The string vocabulary mirrors `internal/channels.RespondPolicy`.
  string respond_policy = 9;
  // RFC 0011 PR 4b: orchestrator-pre-resolved sender id of the
  // `thread_id` parent message, when this event is a thread reply.
  // Empty for non-thread events or when the parent has been pruned. The
  // response gate uses `agent_id == thread_parent_sender_id` as the
  // thread-reply-to-self trigger for `when_mentioned` policy without
  // requiring the receiver to look the parent up. Pre-resolved once per
  // publish in `ChannelRouter.Publish` (see RFC 0011 PR plan §PR 4 key
  // implementation details — "amortizes the lookup across fanout").
  string thread_parent_sender_id = 10;
  // RFC 0011 amendment "Cascade-depth wire propagation": cross-process
  // hop in the cooperative-path cascade chain. The agent-side dispatcher
  // increments depth as it forwards events into the next action loop
  // (`agents/dispatch.py` — `metadata["cascade_depth"]`), but the
  // original RFC 0011 §D claim — *"No change to the cascade mechanism
  // is required"* — overlooked that the publish→fanout boundary drops
  // the field entirely. Typed scalar (mirrors the proto/REST asymmetry
  // called out at `task.proto:141-148` for `timestamp`): the metadata
  // map on `ChannelMessage.Metadata` carries the field over REST, while
  // gRPC needs a first-class field because `ChannelMessageEvent` has no
  // metadata map. Orchestrator MUST clamp inbound to
  // `[0, max_cascade_depth]` on receipt; receivers treat the field as
  // advisory until orchestrator-side enforcement lands (PR 2 of the
  // v0.3.0 channel test-findings plan). Proto3 implicit presence: an
  // unset field is indistinguishable from an explicit zero, which is
  // also the cascade-origin value. See
  // `docs/rfcs/0011-amendment-cascade-depth-wire-propagation.md` for
  // the full contract.
  int32 cascade_depth = 11;
  // ISSUE-0068 / RFC 0011 amendment "Participant-type wire propagation":
  // the peer type ("user" | "agent") of `sender_id`. Carried as a
  // first-class field for the same reason as `cascade_depth = 11`:
  // `ChannelMessageEvent` has no metadata map, so the
  // `ChannelMessage.Metadata["participant_type"]` the REST chat handler
  // sets is otherwise dropped at this boundary — leaving the agent's
  // relationship tier to default every channel-delivered chat peer to
  // "agent" instead of "user". The orchestrator populates it from the
  // publish metadata; the agent maps it onto the
  // `sender_participant_type` event-metadata key its episode-routing
  // close path already reads. Empty (proto3 implicit presence) is the
  // genuine agent-to-agent case and resolves to "agent" downstream — the
  // REST chat handler defaults an omitted request field to "user" before
  // publish, so ordinary fanout never fabricates a peer type. See
  // `docs/rfcs/0011-amendment-participant-type-wire-propagation.md`.
  string sender_participant_type = 12;
  // RFC 0030 Tier B (v0.3.8) — the per-recipient salience-bid inputs. Carried
  // as first-class fields for the same reason as `cascade_depth = 11`:
  // `ChannelMessageEvent` has no metadata map. The agent-side seam
  // (`agents/persona_runtime/salience_gate.py`) reads them off the inbound
  // payload to decide whether to run the leased `fast`-model relevance bid.
  //
  // `salience_gated` is per-recipient: true iff this recipient was declared
  // with the open-floor participant vocabulary (`participant`/`chair`) — the
  // dispositions that opt into the bid. A legacy `always` member carries
  // false and keeps replying unconditionally (v0.3.7 behaviour), so the
  // feature is additive. proto3 implicit presence: false (the zero value) is
  // the not-governed case, exactly right for every pre-v0.3.8 publisher.
  bool salience_gated = 13;
  // The recipient's per-disposition salience `threshold` in `[0, 1]` (RFC
  // 0030 Tier B). `optional` (explicit presence) on purpose: an unset
  // threshold is a tri-state distinct from `0.0` — unset biases the bid to
  // silence (demands a decisive score), while an explicit `0.0` is a real
  // floor every parseable score clears (a `chair` carries a low default).
  // Mirrors the `*float64` tri-state on `internal/channels.Member.Threshold`.
  optional double threshold = 14;
  // The channel's total member count at publish time — every membership row,
  // counted before the per-recipient sender/`never` filter, so it is an upper
  // bound on the candidate responders (over-counting only makes the cap below
  // fire sooner, which is the safe direction). The bid uses it for the TB6
  // channel-size cap: above `salience_max_channel_members` the seam skips the
  // bid entirely and falls back to `addressed`-only so a cheap bid × N members
  // stays bounded on large channels. Zero (proto3 implicit) reads as "unknown"
  // and disables the cap (the bid runs), so a pre-v0.3.8 publisher omitting it
  // is safe.
  int32 channel_size = 15;
  // The channel's configured TB6 cap (RFC 0030 amendment OQ #4); zero/absent
  // → the agent-side default (`DEFAULT_SALIENCE_MAX_CHANNEL_MEMBERS = 20`).
  // Channel-level, so it is identical across a fanout's recipients.
  int32 salience_max_channel_members = 16;
  // RFC 0030 deterministic governance layers (v0.3.8) — the RFC 0020
  // `interaction_id` (ULID) of the open Interaction this message belongs to.
  // Carried as a first-class field for the same reason as `cascade_depth = 11`:
  // `ChannelMessageEvent` has no metadata map, so the
  // `ChannelMessage.Metadata["interaction_id"]` the publish path sets is
  // otherwise dropped at this boundary — and Layers 1/2/4 must attribute
  // spend (Layer 1 cost ceiling), count replies (Layer 2 reply budget), and
  // accumulate end-of-interaction votes (Layer 4) per interaction. The
  // orchestrator stamps it from the publish metadata; the agent maps it onto
  // the `interaction_id` event-metadata key and threads it toward the
  // `AcquireLease` call (the wallet-side `interaction_budget_tokens` ceiling
  // lands in the Layer 1 PR — this field is the substrate). Empty (proto3
  // implicit presence) is the genuine pre-v0.3.8 / untracked case and leaves
  // every layer at its uncapped default, so the field is additive. See
  // `docs/rfcs/0030-governance-layers-pr-plan.md` (PR 1).
  //
  // Field 17, not 13: the Tier B salience PRs (#572–#575) took fields 13–16
  // (`salience_gated`/`threshold`/`channel_size`/`salience_max_channel_members`)
  // after the governance-layers plan named "field 13"; 17 is the next free tag.
  string interaction_id = 17;
}

// Generic ack returned by fire-and-acknowledge RPCs (e.g. ReceiveChannelMessage)
// whose response carries no payload beyond success/error. At-most-once delivery
// in v0.3.0 — `success=false` signals the agent rejected or could not process
// the event; the orchestrator does not retry in this release.
//
// Reuse policy (ISSUE-0019): TaskAck stays generic. Channel-specific or
// RPC-specific reasons MUST go in a future `oneof reason` field rather than as
// additional scalar fields here. If a richer ack shape is needed for one
// caller, define a new message (e.g. ChannelMessageAck) rather than extending
// TaskAck — renaming after a second consumer attaches is a breaking proto
// change, and bolting caller-specific scalars on creates optional fields whose
// meaning silently depends on which RPC populated them.
message TaskAck {
  bool success = 1;
  string error_message = 2;       // populated when success == false
}
