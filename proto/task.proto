syntax = "proto3";

package persatrix.v1;

option go_package = "github.com/mkhomutov/persatrix/internal/generated/taskpb";

// ─── Task Execution (orchestrator ↔ agent) ─────────────────

service AgentService {
  // Execute a task on the agent and return the result.
  rpc ExecuteTask(TaskRequest) returns (TaskResponse);

  // Stream task progress (for long-running tasks).
  rpc ExecuteTaskStream(TaskRequest) returns (stream TaskProgress);

  // Health check (grpc.health.v1 compatible).
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Send a chat message to the agent and return a synchronous reply.
  rpc SendChatMessage(ChatRequest) returns (ChatResponse);

  // Deliver a channel message event to a subscribed agent (RFC 0011 §C).
  rpc ReceiveChannelMessage(ChannelMessageEvent) returns (TaskAck);

  // Read closed-interaction summaries (v0.3.8 interaction-summary
  // surface; RFC 0020 §C/§D). Surfaces the one-per-interaction summary
  // persisted at close so a converged brainstorm hands back a readable
  // result. Read-only; the summariser is unchanged.
  rpc GetClosedInteractions(ClosedInteractionsRequest)
      returns (ClosedInteractionsResponse);
}

message TaskRequest {
  string task_id = 1;
  string workflow_id = 2;
  string agent_id = 3;
  string payload = 4;                    // natural language task description
  map<string, string> context = 5;       // outputs from prior workflow steps
  TaskConfig config = 6;
}

message TaskConfig {
  int32 max_llm_calls = 1;
  int32 max_tokens = 2;
  int32 timeout_seconds = 3;
  repeated string allowed_tools = 4;     // tool whitelist for this task
}

message TaskResponse {
  string task_id = 1;
  TaskStatus status = 2;
  string result = 3;
  map<string, string> metadata = 4;      // tokens_used, duration_ms, etc.
  string error_message = 5;              // populated if status == FAILED
}

message TaskProgress {
  string task_id = 1;
  TaskStatus status = 2;
  string message = 3;                    // human-readable progress update
  float progress_percent = 4;            // 0.0 – 1.0
  // Unix epoch seconds. NOTE: ChannelMessageEvent.timestamp is RFC 3339
  // string by deliberate exception (forwarded verbatim to the channel
  // store's messages.created_at column — see field doc). Do not
  // "harmonise" the two without re-reading that rationale. ISSUE-0022.
  int64 timestamp = 5;
}

enum TaskStatus {
  PENDING = 0;
  RUNNING = 1;
  COMPLETED = 2;
  FAILED = 3;
  CANCELLED = 4;
  RETRYING = 5;
}

// ─── Health Check ──────────────────────────────────────────

message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  HealthStatus status = 1;
}

enum HealthStatus {
  UNKNOWN = 0;
  SERVING = 1;
  NOT_SERVING = 2;
}

// ─── Human Chat (REST ↔ agent gRPC) ───────────────────────

message ChatRequest {
  string agent_id = 1;
  string user_id = 2;
  string message = 3;              // max 4000 chars enforced server-side
  // RFC 0016 chat-conversation token. Renamed from `session_id` in v0.3.1
  // to disambiguate from RFC 0031's operator-namespace `session_id`
  // landing on channels/messages/episodes/relationships. Field number
  // unchanged (binary-proto consumers unaffected); JSON/proto-text
  // consumers must migrate. Resolves RFC 0031 OQ #8.
  string chat_session_id = 4;      // empty → server generates UUID; max 128 chars
  int32 timeout_seconds = 5;       // 0 or negative → server default (30s); max 300s
  string participant_type = 6;     // defaults to "user" when empty
}

message ChatResponse {
  string reply = 1;
  // RFC 0016 chat-conversation token; see ChatRequest.chat_session_id.
  string chat_session_id = 2;
  string agent_id = 3;
  // Unix epoch seconds. NOTE: ChannelMessageEvent.timestamp is RFC 3339
  // string by deliberate exception (forwarded verbatim to the channel
  // store's messages.created_at column — see field doc). Do not
  // "harmonise" the two without re-reading that rationale. ISSUE-0022.
  int64 timestamp = 4;
  string agent_display_name = 5;  // populated by orchestrator from Registry
  string reply_status = 6;        // "ok" | "empty" | "error"
}

// ─── Channel Message Delivery (orchestrator → subscribed agent) ────
// RFC 0011 §C. Carries a single channel message to one subscriber.
// `channel_type` duplicates the prefix encoded in `channel_id`
// ("group:" / "dm:" / "thread:") and is carried separately for
// log/observability ergonomics — counters and span attributes use it
// without parsing. Orchestrator MUST validate agreement with the prefix
// on publish (Phase 2 `ChannelRouter`); receivers MUST drop on mismatch
// as malformed rather than pick one source (deny-by-default per
// `.github/copilot-instructions.md`; PR #246 deep review security
// finding — tightened from prior "SHOULD"). Receiver-side enforcement
// lives in `agents/channel_validation.py::validate_channel_message_event`
// (RFC 0011 PR 4a-i, #248).
message ChannelMessageEvent {
  // UUID v4 generated by the orchestrator's ChannelRouter on publish.
  // Receivers MUST NOT assume any other format; future versions may
  // switch to ULID or another monotonic scheme. PR #246 review NTH3.
  string message_id = 1;
  string channel_id = 2;
  string channel_type = 3;        // "group" | "dm" | "thread"
  // Orchestrator-authoritative: populated from the orchestrator's
  // authenticated agent registry on publish. Receivers MUST NOT trust
  // this field over a non-mTLS transport; in v0.3.0 the gRPC port is
  // cleartext and assumed local-only (see `agents/server.py` TLS TODO).
  // PR #246 deep review security finding (sender-spoofing trust boundary).
  string sender_id = 4;
  // Free-form user/agent text. Max 4000 chars enforced server-side
  // (mirrors `ChatRequest.message`); receivers MUST reject longer
  // payloads. May contain PII — handlers MUST NOT log `content` at
  // INFO/DEBUG without redaction. PR #246 deep review M1.
  string content = 5;
  // RFC 3339 string (NOT Unix epoch like ChatResponse.timestamp /
  // TaskProgress.timestamp). Chosen because the value is forwarded
  // verbatim to the channel store's `messages.created_at` column
  // (SQLite TEXT/DATETIME, RFC 0011 §A) — using `int64` here would
  // force a server-side format conversion on every publish purely to
  // satisfy the wire shape. Receivers MUST treat malformed timestamps
  // as a drop reason. See PR #246 deep review finding M4.
  string timestamp = 6;
  // Empty string if not a reply. Max 128 chars when set (mirrors
  // `ChatRequest.chat_session_id` bound). PR #246 deep review M1.
  string thread_id = 7;
  // Max 10 entries per event (mirrors `_MAX_MENTIONS_PER_ACTION` in
  // `agents/dispatch.py`); each entry is an agent_id constrained by
  // the canonical pattern `^[a-z0-9][a-z0-9-]*[a-z0-9]$`. Receivers
  // MUST reject over-cap or pattern-violating entries to bound fan-out
  // cost and preserve ID hygiene. Tracked at REST boundary by
  // `docs/issues/ISSUE-0011`. PR #246 deep review M1.
  repeated string mentions = 8;
  // RFC 0011 PR 4b: per-recipient response policy carried so the
  // agent-side gate can decide pre-LLM whether to suppress without an
  // extra REST roundtrip. Values: "when_mentioned" | "always". The
  // orchestrator MUST NOT dispatch to a `respond: never` member at all
  // (filtered upstream in `ChannelRouter.fanout`); receivers therefore
  // MUST treat `respond_policy="never"` on the wire as malformed.
  // Empty is also malformed — every dispatch must carry the recipient's
  // policy. The string vocabulary mirrors `internal/channels.RespondPolicy`.
  string respond_policy = 9;
  // RFC 0011 PR 4b: orchestrator-pre-resolved sender id of the
  // `thread_id` parent message, when this event is a thread reply.
  // Empty for non-thread events or when the parent has been pruned. The
  // response gate uses `agent_id == thread_parent_sender_id` as the
  // thread-reply-to-self trigger for `when_mentioned` policy without
  // requiring the receiver to look the parent up. Pre-resolved once per
  // publish in `ChannelRouter.Publish` (see RFC 0011 PR plan §PR 4 key
  // implementation details — "amortizes the lookup across fanout").
  string thread_parent_sender_id = 10;
  // RFC 0011 amendment "Cascade-depth wire propagation": cross-process
  // hop in the cooperative-path cascade chain. The agent-side dispatcher
  // increments depth as it forwards events into the next action loop
  // (`agents/dispatch.py` — `metadata["cascade_depth"]`), but the
  // original RFC 0011 §D claim — *"No change to the cascade mechanism
  // is required"* — overlooked that the publish→fanout boundary drops
  // the field entirely. Typed scalar (mirrors the proto/REST asymmetry
  // called out at `task.proto:141-148` for `timestamp`): the metadata
  // map on `ChannelMessage.Metadata` carries the field over REST, while
  // gRPC needs a first-class field because `ChannelMessageEvent` has no
  // metadata map. Orchestrator MUST clamp inbound to
  // `[0, max_cascade_depth]` on receipt; receivers treat the field as
  // advisory until orchestrator-side enforcement lands (PR 2 of the
  // v0.3.0 channel test-findings plan). Proto3 implicit presence: an
  // unset field is indistinguishable from an explicit zero, which is
  // also the cascade-origin value. See
  // `docs/rfcs/0011-amendment-cascade-depth-wire-propagation.md` for
  // the full contract.
  int32 cascade_depth = 11;
  // ISSUE-0068 / RFC 0011 amendment "Participant-type wire propagation":
  // the peer type ("user" | "agent") of `sender_id`. Carried as a
  // first-class field for the same reason as `cascade_depth = 11`:
  // `ChannelMessageEvent` has no metadata map, so the
  // `ChannelMessage.Metadata["participant_type"]` the REST chat handler
  // sets is otherwise dropped at this boundary — leaving the agent's
  // relationship tier to default every channel-delivered chat peer to
  // "agent" instead of "user". The orchestrator populates it from the
  // publish metadata; the agent maps it onto the
  // `sender_participant_type` event-metadata key its episode-routing
  // close path already reads. Empty (proto3 implicit presence) is the
  // genuine agent-to-agent case and resolves to "agent" downstream — the
  // REST chat handler defaults an omitted request field to "user" before
  // publish, so ordinary fanout never fabricates a peer type. See
  // `docs/rfcs/0011-amendment-participant-type-wire-propagation.md`.
  string sender_participant_type = 12;
  // RFC 0030 Tier B (v0.3.8) — the per-recipient salience-bid inputs. Carried
  // as first-class fields for the same reason as `cascade_depth = 11`:
  // `ChannelMessageEvent` has no metadata map. The agent-side seam
  // (`agents/persona_runtime/salience_gate.py`) reads them off the inbound
  // payload to decide whether to run the leased `fast`-model relevance bid.
  //
  // `salience_gated` is per-recipient: true iff this recipient was declared
  // with the open-floor participant vocabulary (`participant`/`chair`) — the
  // dispositions that opt into the bid. A legacy `always` member carries
  // false and keeps replying unconditionally (v0.3.7 behaviour), so the
  // feature is additive. proto3 implicit presence: false (the zero value) is
  // the not-governed case, exactly right for every pre-v0.3.8 publisher.
  bool salience_gated = 13;
  // The recipient's per-disposition salience `threshold` in `[0, 1]` (RFC
  // 0030 Tier B). `optional` (explicit presence) on purpose: an unset
  // threshold is a tri-state distinct from `0.0` — unset biases the bid to
  // silence (demands a decisive score), while an explicit `0.0` is a real
  // floor every parseable score clears (a `chair` carries a low default).
  // Mirrors the `*float64` tri-state on `internal/channels.Member.Threshold`.
  optional double threshold = 14;
  // The channel's total member count at publish time — every membership row,
  // counted before the per-recipient sender/`never` filter, so it is an upper
  // bound on the candidate responders (over-counting only makes the cap below
  // fire sooner, which is the safe direction). The bid uses it for the TB6
  // channel-size cap: above `salience_max_channel_members` the seam skips the
  // bid entirely and falls back to `addressed`-only so a cheap bid × N members
  // stays bounded on large channels. Zero (proto3 implicit) reads as "unknown"
  // and disables the cap (the bid runs), so a pre-v0.3.8 publisher omitting it
  // is safe.
  int32 channel_size = 15;
  // The channel's configured TB6 cap (RFC 0030 amendment OQ #4); zero/absent
  // → the agent-side default (`DEFAULT_SALIENCE_MAX_CHANNEL_MEMBERS = 20`).
  // Channel-level, so it is identical across a fanout's recipients.
  int32 salience_max_channel_members = 16;
  // RFC 0030 deterministic governance layers (v0.3.8) — the RFC 0020
  // `interaction_id` of the open Interaction this message belongs to. Opaque
  // string id (RFC 0020 §D names it a ULID, but the agent-side implementation
  // mints `str(uuid.uuid4())` — see `agents/memory/interactions.py`; treat the
  // value as an opaque token, not a sortable ULID). Carried as a first-class
  // field for the same reason as `cascade_depth = 11`: `ChannelMessageEvent`
  // has no metadata map, so a `ChannelMessage.Metadata["interaction_id"]` would
  // otherwise be dropped at this boundary — and Layers 1/2/4 must attribute
  // spend (Layer 1 cost ceiling), count replies (Layer 2 reply budget), and
  // accumulate end-of-interaction votes (Layer 4) per interaction. Contract:
  // the orchestrator's own resolver (`internal/channels/interaction_resolver.go`,
  // the interaction-id producer plan IP1/IP2) stamps the resolved id onto the
  // publish metadata — REPLACING any publisher-supplied claim, which never
  // keys governance state — and it is lifted here; the agent maps it onto the
  // `interaction_id` event-metadata key. The producer plan's PR 2 threads that
  // key toward the `AcquireLease` call (the wallet-side
  // `interaction_budget_tokens` ceiling already landed — this field is the
  // substrate). The field is therefore non-empty on every routed publish;
  // empty (proto3 implicit presence) survives as the pre-v0.3.8 / untracked
  // case and leaves every layer at its uncapped default, so the field stays
  // additive across a mixed-version deployment. See
  // `docs/rfcs/0030-interaction-id-producer-pr-plan.md`.
  //
  // Field 17, not 13: the Tier B salience PRs (#572–#575) took fields 13–16
  // (`salience_gated`/`threshold`/`channel_size`/`salience_max_channel_members`)
  // after the governance-layers plan named "field 13"; 17 is the next free tag.
  string interaction_id = 17;
  // RFC 0030 floor-capable-directedness amendment (v0.3.8): the subset of
  // `mentions = 8` naming *floor-capable* members — current channel members,
  // **other than the message's sender**, whose normalized respond policy is
  // not `never`. The sender exclusion is load-bearing, not cosmetic: both
  // sides already refuse a sender the floor on its own message, so a sole
  // self-mention must resolve to the empty subset (open floor) — a
  // policy-only definition would let the sender's own name re-close the
  // floor (amendment §A). Resolved once per publish by the orchestrator at
  // fanout (it owns the membership view the receiver gate lacks — the
  // `thread_parent_sender_id = 10` pre-resolution precedent), deduplicated,
  // and identical across a fanout's recipients. The receiver-side Tier A
  // directed-elsewhere decision uses THIS list as its suppression basis: a
  // message whose mentions name only floor-incapable parties (the human
  // operator joined `respond: never`, an `observer`, a non-member, the
  // sender itself) is open floor, not directed — mentioning someone who
  // cannot take the floor must not close it. The raw `mentions` list keeps
  // serving the admit paths (named-recipient / `@everyone` broadcast) and
  // display; the `@everyone` sentinel is never a member id, so it never
  // appears here.
  // See `docs/rfcs/0030-amendment-floor-capable-directedness.md`.
  repeated string floor_mentions = 18;
  // Producer-presence flag for `floor_mentions = 18`. proto3 repeated fields
  // have no field presence, and "resolved to empty" (a new orchestrator found
  // no floor-capable mention — exactly the reclassified-to-open-floor case the
  // amendment exists for) must be distinguishable from "never resolved" (an
  // old orchestrator that predates the field), or the receiver's legacy
  // fallback would re-suppress the very messages the fix reclassifies. The
  // orchestrator sets this true on every dispatch unconditionally; receivers
  // use `floor_mentions` as the suppression basis iff this is true and fall
  // back to the raw `mentions` basis (the pre-amendment behaviour, degrading
  // toward over-suppression, never under-suppression) when false. proto3
  // implicit presence: false (the zero value) is the genuine old-producer
  // case, so the field is additive across a mixed-version deployment.
  bool floor_mentions_resolved = 19;
  // RFC 0030 interaction-id producer plan OQ 5 (v0.3.8) — the channel's most
  // recently RETIRED interaction id, paired with `= 21` below. The resolver
  // (`internal/channels/interaction_resolver.go`) rotates `interaction_id = 17`
  // when a conversation ends, but the rotation alone carries no *cause*, so
  // the agent-side boundary close (`wire_rotation_closes`) had to label every
  // observed rotation "structural"/ended — wrong for an idle rotation under a
  // channel window shorter than the agent's own (PR 607 review finding 3).
  // `publishCommit` stamps the retired id + its close trigger onto every
  // publish of the SUCCESSOR interaction; the receiver applies the trigger
  // only when this id equals the wire id its open local record was opened
  // under (a mismatch means the agent missed a generation — the cause of ITS
  // boundary is unknown and the legacy label stands). Empty (proto3 implicit
  // presence) is the no-retiree case: an old producer, a fresh channel's
  // first interaction, or an orchestrator-restart re-mint (IP5: the resolver
  // table is in-memory, so a restart has no retiree to attribute) — receivers
  // MUST keep the pre-OQ5 behaviour, so the field stays additive across a
  // mixed-version deployment. Same opaque-token + 128-byte bound contract as
  // `interaction_id = 17`.
  string previous_interaction_id = 20;
  // The close trigger that retired `previous_interaction_id = 20`:
  // "idle" (lazy idle rotation) | "end_votes" (Layer 4 quorum close) — the
  // same vocabulary as the `channel.conversation.interaction_closed{trigger}`
  // instrument (§L; `idleTrigger`/`endVotesTrigger` in Go, pinned by the
  // cross-language drift test). The receiver maps "idle" to its local
  // `idle_gap` close reason and "end_votes" to `structural`; an empty or
  // unrecognised value degrades to the pre-OQ5 structural label rather than
  // failing the dispatch (the tolerant-wire-reader posture of
  // `readInteractionID`). Set iff `= 20` is set.
  string previous_interaction_close_trigger = 21;
  // Chair-stall-escalation amendment (RFC 0030 minimal Layer 5 slice,
  // v0.3.8): true iff this dispatch is the orchestrator's forced turn to the
  // channel's `escalation_chair_id` after a stalled floor round (zero
  // replies, >=1 granted turn, open tracked interaction - CE1). The receiver
  // routes a marked event down the directed lane: the response gate admits
  // it and the Tier B salience bid is skipped (re-running the bid would
  // re-produce the very silence being escalated - CE3). Orchestrator-
  // authored, the same trust class as `floor_mentions`; never set by
  // ordinary fanout. proto3 implicit presence: false (the zero value) is
  // every non-escalation dispatch, so the field is additive - an old
  // producer never sets it and an old consumer ignoring it sees an ordinary
  // open-floor message (degraded to the pre-amendment stall, CE7/SD).
  bool chair_escalation = 22;
  // End-vote-close-propagation amendment (RFC 0030 §H, v0.3.8): true iff
  // this dispatch is the orchestrator's close NOTIFICATION - the closing
  // quorum vote re-dispatched to every dispatch-served non-sender member
  // after an `end_votes` close, whose ordinary fanout is suppressed
  // (CP1/CP2). Control, never stimulus: the receiver's response gate
  // refuses a marked event pre-LLM (no turn, no Tier B bid, no LLM call),
  // the window keeps the closing message via ingest-on-suppress, and the
  // agent-local tracker closes the channel scope immediately with the
  // `end_votes` cause - the "ended" render, instead of idling out a window
  // later (CP3). Orchestrator-authored, the same trust class as
  // `chair_escalation = 22`; never set by ordinary fanout, honoured only
  // from this typed field and strictly boolean receiver-side. proto3
  // implicit presence: false (the zero value) is every ordinary dispatch,
  // so the field is additive - an old producer never sets it and an old
  // consumer ignoring it sees a single-recipient delivery of the closing
  // vote (one Tier B bid, any reply dropped by the post-close guard -
  // degraded but bounded, amendment SD).
  bool interaction_close_notification = 23;
  // Chair-stall-escalation resynthesize variant (ISSUE-0099, v0.3.8): a
  // REFINEMENT of `chair_escalation = 22`, never set alone. The orchestrator
  // sets both on the SECOND forced turn — the one it dispatches after the
  // chair's first forced-turn reply provably reached nobody (its mentions
  // named only parties that cannot take the floor, so `resolveFloorMentions`
  // came up empty). The lift is unchanged: the receiver keys admission and
  // the Tier-B-bid skip on `chair_escalation = 22` exactly as before, so this
  // field touches only the FRAMING — the persona renders the synthesize-only
  // variant (`prompts/runtime/safety/chair-escalation-resynthesize.md`)
  // instead of the two-outcome default, because handing off again is the move
  // that just failed. Orchestrator-authored, the same trust class as
  // `chair_escalation = 22`. proto3 implicit presence: false (the zero value)
  // is every dispatch that is not this second forced turn, so the field is
  // additive — an old producer never sets it, and an old consumer ignoring it
  // still gets the lift from field 22 and renders the two-outcome framing
  // (degraded but functional: synthesis is outcome (a) there too).
  bool chair_escalation_resynthesize = 24;
  // RFC 0051 (v0.3.10) reasoning-before-posting — the channel's resolved
  // deliberation rung (`off` | `bid` | `plan`) for this recipient. Carried as
  // a first-class field for the same reason as the Tier B salience inputs
  // (`salience_gated = 13` …): `ChannelMessageEvent` has no metadata map, and
  // the agent-side seam (`agents/persona_runtime/salience_gate.py`) needs the
  // mode to pick the bid's verdict grammar — scalar score gate (`off`),
  // structured silence verdict (`bid`), or silence verdict + plan-threaded
  // compose (`plan`). Channel-level (identical across a fanout's recipients);
  // the orchestrator stamps `ChannelRouter.ReasoningFor(channelID).Mode`, which
  // already encodes the PR 6 go-live flip (a governed channel with no explicit
  // override resolves to `bid`, an explicit `off` stays the kill switch).
  //
  // proto3 implicit presence: the empty string (zero value) is the pre-v0.3.10
  // / untracked case, which the agent maps to `off` (the scalar score gate,
  // byte-for-byte v0.3.8) — so the field is additive across a mixed-version
  // deployment exactly like `salience_gated`. The mode only ever arms the
  // structured path on a `salience_gated` recipient, so an `off` here and a
  // non-`salience_gated` recipient are both inert.
  string reasoning_mode = 25;
  // RFC 0051 PR 8 (v0.3.10) Phase 5a — the channel's resolved reflexion round
  // count (`reasoning.revise`, 0..2) for this recipient. Carried as a first-class
  // field for the same reason as `reasoning_mode = 25`: `ChannelMessageEvent` has
  // no metadata map, and the agent-side reflexion loop
  // (`agents/persona_runtime/reflexion.py`) needs the count to bound its
  // critic→revise rounds after the Tier-C compose. Channel-level (identical
  // across a fanout's recipients); the orchestrator stamps
  // `ChannelRouter.ReasoningFor(channelID).Revise`.
  //
  // proto3 implicit presence: 0 (the zero value) is single-pass — no reflexion —
  // and is both the default and the pre-Phase-5 / untracked case, so the field is
  // additive across a mixed-version deployment. It is meaningful only paired with
  // `reasoning_mode = plan` (the critic re-reads the draft against the plan); the
  // config `validate` rejects `revise >= 1` on any other rung, and the agent seam
  // pins it to 0 off the `plan` path, so a stray non-zero value here is inert.
  int32 reasoning_revise = 26;
  // RFC 0052 §B (v0.3.11): true iff this dispatch is the orchestrator's
  // CONVENE forced turn — the directed dispatch that opens an autonomous
  // agent-only channel (`internal/channels/convene.go`). The convener
  // persona authors the opening turn from which the existing
  // `InboundEventWake` chain carries the discussion with no human message.
  // The dispatch's `content` carries the operator topic/agenda/goal
  // (assembled from the channel's `autonomous` config); the receiver wraps
  // it in the RFC 0009 `<external_data>` envelope before injection (it is
  // operator config, a distinct trust class — the one genuinely new
  // injection surface). The receiver admits a marked event down the same
  // directed lane as `chair_escalation = 22` (gate admit for any non-`never`
  // policy, Tier B bid skipped so the bias-to-silence verdict never silences
  // the opener) and renders the convener framing
  // (`prompts/runtime/safety/convener-opening.md`) instead of the
  // peer-message shape. Orchestrator-authored, the same trust class as
  // `chair_escalation = 22`; never set by ordinary fanout, honoured only from
  // this typed field and strictly boolean receiver-side. proto3 implicit
  // presence: false (the zero value) is every non-convene dispatch, so the
  // field is additive — an old producer never sets it and an old consumer
  // ignoring it sees an ordinary open-floor message (no opener authored —
  // the channel simply never convenes, the inert pre-v0.3.11 posture).
  bool convene = 27;
  // RFC 0052 §D (v0.3.11 PR 4b-ii): true iff this close NOTIFICATION's
  // closing message was ALREADY delivered live via ordinary fanout — the
  // FLOOR-path bounded close, whose bounding stimulus reached every member
  // inside its floor round before the tail trigger fired (unlike the
  // end-vote close, whose vote's own fanout is suppressed, and the
  // concurrent-path bounded close, which withholds the bounding dispatch —
  // both sole-delivery). Set only together with
  // `interaction_close_notification = 23`. The receiver skips the
  // final-turn ingest and closes its scope directly, so the closed record
  // no longer carries one duplicate final turn + a `turn_count` inflated by
  // one per non-sender member per close (the PR 4b-i documented limit —
  // `close_notification.py`; the fresh wire id defeats any id-based dedup
  // by design, which is why this must be a typed field). proto3 implicit
  // presence: false (the zero value) is every sole-delivery notification
  // and every old producer, whose receivers keep the ingest-then-close
  // behaviour — degraded to the pre-4b-ii duplicate, never a lost turn —
  // so the field is additive across a mixed-version deployment.
  bool close_notification_redelivery = 28;
  // RFC 0052 §D (v0.3.11 PR 4b-ii): the truthful close cause of THIS close
  // notification — "structural" (`autonomous.max_rounds`) | "cost" (the
  // wallet soft-budget threshold), the same §L instrument vocabulary as
  // `previous_interaction_close_trigger = 21`. Stamped ONLY by the RFC 0052
  // bounded close ([ChannelRouter.boundedClose]'s notification fan), so its
  // presence doubles as the OQ #6 metering key: a non-empty value tells the
  // receiver the closing interaction is an AUTONOMOUS bounded close, whose
  // RFC 0020 close summary must draw a wallet lease stamped with the
  // interaction's id (`summarize_close.py`) so the summary counts toward
  // the mandatory cap — the `1 + N` reserve PR 4a sized exists for exactly
  // those calls. The receiver also maps "cost" to its truthful local
  // `cost` close reason instead of the 4b-i `REASON_STRUCTURAL` fallback
  // (`wire_rotation_close_reason` documents the deferral). Set iff
  // `interaction_close_notification = 23` is set AND the close was the
  // bounded close; empty (proto3 implicit presence) is every end-vote/idle
  // notification, every human channel, and every old producer — the
  // receiver keeps the structural label and the summary stays unleased,
  // byte-for-byte the pre-4b-ii close, so the field is additive across a
  // mixed-version deployment. Unrecognised values degrade to absent at the
  // seed point (the tolerant-wire-reader posture of the field-21
  // allowlist).
  string close_notification_close_trigger = 29;
  // RFC 0052 §D (v0.3.11 PR 4b-ii): true iff this dispatch is the
  // orchestrator's SYNTHESIS forced turn — the directed dispatch sent to
  // the channel's `escalation_chair_id` when the deterministic bounded
  // close trips, asking the chair to author the goal-directed closing
  // synthesis (`internal/channels/synthesis_close.go`). The dispatch's
  // `content` carries the operator goal/topic directive (assembled from the
  // channel's `autonomous` config); the receiver wraps it in the RFC 0009
  // `<external_data>` envelope before injection (operator config is a
  // distinct trust class — the convene precedent) and renders the synthesis
  // framing (`prompts/runtime/safety/synthesis-turn.md`). The receiver
  // admits a marked event down the same directed lane as
  // `chair_escalation = 22` (gate admit for any non-`never` policy, Tier B
  // bid skipped — re-running the bias-to-silence bid would silence the one
  // mandatory turn §D exists to guarantee). The chair's reply echoes its
  // dispatched-under interaction id as the publish claim (the PR 4b-i
  // origin pair), which is how the orchestrator recognises it as the
  // CLOSING ARTIFACT — the close-on-reply ordering — instead of a fresh
  // stimulus that would re-fan and reopen the discussion. Orchestrator-
  // authored, the same trust class as `convene = 27`; never set by ordinary
  // fanout, honoured only from this typed field and strictly boolean
  // receiver-side. proto3 implicit presence: false (the zero value) is
  // every non-synthesis dispatch, so the field is additive — an old
  // producer never sets it and an old consumer ignoring it sees an ordinary
  // open-floor message whose reply still claims the retired id and lands in
  // the no-reopen latch (degraded to the 4b-i artifact-less close, never a
  // reopen).
  bool synthesis_turn = 30;
  // RFC 0037 §B (v0.3.12, PR 2): the dispatching channel's confidentiality
  // classification — "public" | "internal" | "restricted" | "secret", the §A
  // lattice — populated from the `channels` row at dispatch
  // (`channelMessageToProto` via the router's per-dispatch resolve) so the
  // persona runtime can run the §D injection gate per turn without a
  // channel-metadata roundtrip. Carried as a first-class field for the same
  // reason as `cascade_depth = 11`: `ChannelMessageEvent` has no metadata
  // map. Receiver contract (§A rule (b)): empty (a pre-v0.3.12 producer, or
  // a dispatch whose channel-row read failed) and any out-of-lattice value
  // resolve to the `public` acting floor at the read site
  // (`agents/persona_runtime/classification.py::acting_rank`) — never
  // `internal` — so an unclassified or garbled event can only UNDER-inject,
  // the fail-closed direction. The value is seeded verbatim at the receive
  // boundary (`agents/channel_event_classification.py`); no receiver-side
  // default is applied (RFC 0037 PR 1's one-resolver-per-rule discipline).
  // Dark in PR 2: delivered on both paths (this field + the REST
  // message/history `classification`), read by nothing until the PR 4 gate.
  string classification = 31;
}

// Generic ack returned by fire-and-acknowledge RPCs (e.g. ReceiveChannelMessage)
// whose response carries no payload beyond success/error. At-most-once delivery
// in v0.3.0 — `success=false` signals the agent rejected or could not process
// the event; the orchestrator does not retry in this release.
//
// Reuse policy (ISSUE-0019): TaskAck stays generic. Channel-specific or
// RPC-specific reasons MUST go in a future `oneof reason` field rather than as
// additional scalar fields here. If a richer ack shape is needed for one
// caller, define a new message (e.g. ChannelMessageAck) rather than extending
// TaskAck — renaming after a second consumer attaches is a breaking proto
// change, and bolting caller-specific scalars on creates optional fields whose
// meaning silently depends on which RPC populated them.
message TaskAck {
  bool success = 1;
  string error_message = 2;       // populated when success == false
}

// ─── Closed-Interaction Summary Read (REST ↔ agent gRPC) ──────────
// v0.3.8 interaction-summary surface. The RFC 0020 summary is persisted
// to the agent's episodic store at interaction close (any trigger: idle,
// structural/end-vote, or the RFC 0030 Layer 1 cost ceiling); this RPC
// reads it back so the web console + CLI can show the synthesised
// outcome. Surface-only — no summary is (re)generated here.
message ClosedInteractionsRequest {
  string agent_id = 1;
  // Optional: restrict to a single RFC 0020 scope (e.g. "group:room-7").
  // Empty → the agent's most-recent closed interactions across scopes.
  string scope = 2;
  // Optional: filter by id. Matches EITHER the agent-side RFC 0020 episode
  // id (returns that one interaction) OR the RFC 0030 governance interaction
  // id (ISSUE-0102 PR 2 — one governance interaction maps to several
  // episodes, so this may return more than one row). Empty → list mode.
  string interaction_id = 3;
  // Max rows returned (recency order by closed_at). 0 → server default;
  // the server caps the value regardless.
  int32 limit = 4;
  // Optional minimum turn_count. 0 / unset → 1 (return everything,
  // including the degenerate single-turn rows the plan keeps retrievable).
  // Set to 2 to list only genuine multi-turn interactions and exclude the
  // single-turn tick/task envelopes from an unscoped list.
  int32 min_turns = 5;
}

message ClosedInteraction {
  // The persona's own RFC 0020 memory-episode id (minted agent-side on the
  // persona's idle clock) — NOT the orchestrator's RFC 0030 governance
  // interaction id stamped on channel messages and the end-vote close logs.
  // The two segment on independent clocks, so one governance interaction can
  // map to several of these episode ids; use `governance_interaction_id`
  // below to cross-reference the channel-side id (ISSUE-0102).
  string interaction_id = 1;
  string scope = 2;
  // Unix epoch seconds (REAL in the episodes table). For a closed
  // interaction `closed_at` is always populated.
  double started_at = 3;
  double closed_at = 4;
  int32 turn_count = 5;
  // The RFC 0020 close trigger this interaction ended on:
  // "idle_gap" | "structural" | "max_turns" | "cost" | "shutdown" | ...
  // Read from the persisted episode context; empty when a legacy row
  // predates close-reason capture.
  string close_reason = 6;
  // The persisted per-interaction summary. The
  // "[interaction summary unavailable]" sentinel is surfaced verbatim so
  // a failed summary is shown honestly (never blanked or fabricated).
  string summary = 7;
  // Distinct participant ids (senders) seen across the interaction's
  // turns, in first-seen order. Derived from the persisted episode
  // context (multi-turn: each turn's `sender`; single-turn: the event
  // `sender`); empty for a legacy row that predates turn capture. The
  // owning agent is not included — these are the *other* parties.
  repeated string participants = 8;
  // The orchestrator-minted RFC 0030 governance interaction id this episode
  // was opened under (the channel conversation's wire id, carried inbound on
  // ChannelMessageEvent.interaction_id and stamped onto the local interaction
  // by episode routing). This is the id the end-vote close logs and channel
  // messages carry — exposing it alongside the agent-side `interaction_id`
  // makes the channel-side id directly cross-referenceable (ISSUE-0102).
  // Empty when the interaction carried no governance id (DM / thread / non-
  // channel scope, an old orchestrator, or a legacy row persisted before this
  // field existed).
  string governance_interaction_id = 9;
}

message ClosedInteractionsResponse {
  repeated ClosedInteraction interactions = 1;
}
