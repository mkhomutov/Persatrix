[project]
name = "orchestr8-agents"
version = "0.1.0"
description = "Orchestr8 AI Agent Runtime"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

# PR review: upper bounds prevent silent breakage from major version bumps.
# Caps are set at the next major (or next minor for 0.x) version to allow
# compatible updates while guarding against breaking API changes.
dependencies = [
    "grpcio>=1.71.2,<2",
    "grpcio-tools>=1.71.2,<2",
    "protobuf>=5.28.0,<6",
    "pyyaml>=6.0,<7",
    "aiohttp>=3.9.0,<4",
    "anthropic>=0.40.0,<1",
    "openai>=1.50.0,<2",
    "opentelemetry-api>=1.28.0,<2",
    "opentelemetry-sdk>=1.28.0,<2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0,<2",
    "opentelemetry-semantic-conventions>=0.49b0,<1",
    "jsonschema>=4.23.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML",
    "types-protobuf",
]
accurate-tokens = [
    "tiktoken>=0.7.0,<1",
]

[project.scripts]
orchestr8-agent = "orchestr8_agents.server:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

# Map the agents/ directory to the 'orchestr8_agents' import path.
# Without this, pip install would discover sub-packages (generated, memory, etc.)
# as top-level packages, and 'python -m orchestr8_agents.server' would fail
# with ModuleNotFoundError since no 'orchestr8_agents' package would exist.
[tool.setuptools.package-dir]
orchestr8_agents = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["orchestr8_agents*"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Machine-generated protobuf/gRPC stubs — do not lint.
extend-exclude = ["generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# gRPC servicer methods use PascalCase per proto contract.
"server.py" = ["N802"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# testpaths is not set here because test paths are specified explicitly
# in the Makefile targets. Python tests live at tests/unit/python/ (repo root),
# not under agents/tests/.
