# DOCUMENTATION ONLY — runtime config is env-driven.
#
# RFC 0009 PR 1b — security audit log configuration.
#
# This file documents the audit-log knobs the orchestrator honours via
# environment variables. Mirroring the existing prometheus.yaml /
# otel-collector.yaml convention keeps every observability surface
# documented in one directory; runtime behaviour is still driven by the
# env vars below (see docs/observability.md §Audit Log).
#
# Neighbouring files in this directory (`prometheus.yaml`,
# `otel-collector.yaml`) ARE consumed at runtime by the OTEL Collector
# / Prometheus container. This file is NOT — editing the values below
# does not change orchestrator behaviour. PR #234 review N-2: surface
# that distinction up front so an operator triaging an incident does
# not infer a runtime knob from the file's location.
#
# Status: documentation-only in PR 1b. PR 2 (rate-limit middleware)
# extends this file with the security.rate_limit.* keys.

audit:
  # On-disk JSONL sink. Override via OBSERVABILITY_AUDIT_PATH; set the env
  # var to the literal "off" to disable audit emission entirely (matches
  # the logbuffer / metrics opt-out convention).
  path: "data/logs/audit.jsonl"

  # File mode applied on every open. The orchestrator self-heals to 0o600
  # so a pre-existing file created under a relaxed umask cannot leak the
  # audit chain (PR #233 review Should-Fix #6).
  file_mode: "0o600"

  # Telemetry-class events (tool.invoked, agent.registered, etc.) are
  # batched. Security-class events (capability.violation, chain.bootstrap,
  # chain.recovered, rate_limit.unauthenticated_caller) bypass the batch
  # and fsync per-event so an attacker cannot mask probing activity by
  # crashing the process inside the 250 ms window.
  batch:
    size: 64
    interval_ms: 250

# Reserved for PR 2 — rate-limit middleware knobs land here.
# security:
#   rate_limit:
#     enabled: true
#     calls_per_window: 60
#     window_seconds: 60
#     # Bounds the per-agent ring map under self-reported X-Agent-ID
#     # (PR #232 review SF-1). Until Phase 4 token validation lands,
#     # an attacker spamming distinct fake IDs can grow the map without
#     # bound; the LRU cap below is the v0.3.0 mitigation.
#     max_tracked_agents: 1000

# RFC 0009 PR 3 — input sanitiser (prompt-injection defense-in-depth).
#
# The sanitiser runs over content tagged ContextSourceExternal /
# ContextSourceChannelMessage / ContextSourceAgentOutput before that
# content reaches the LLM. Detection patterns live in
# internal/security/sanitize_patterns.go (Go) and the byte-identical
# mirror agents/security_patterns.py (Python). Pattern parity is
# guaranteed by `make generate-sanitizer-patterns-check`.
#
# `action` controls what happens on flag:
#
#   passthrough (default): content reaches the agent inside an
#       <external_data flagged="true"> envelope. The persona system
#       prompt instructs the LLM not to follow embedded directives.
#       Audit event input.flagged still fires.
#
#   quarantine: content is dropped; the agent receives the structured
#       error tool_result_quarantined with the matched flag list.
#       Production deployments ingesting from genuinely untrusted
#       bridges (Slack, Discord, email — v0.5.0) should opt into this.
#
# Override via env: SECURITY_SANITIZER_ACTION=quarantine
#
# TODO(rfc0009 follow-up): runtime wiring deferred. Today this key is
# documentation-only — neither the Go orchestrator nor the Python
# `maybe_wrap_tool_content` helper consults it at startup. A deploy that
# sets SECURITY_SANITIZER_ACTION=quarantine currently still runs in
# passthrough mode. The audit-config loader that picks this up lands in
# the same follow-up that pipes Python tool-result flag events to the
# Go-side audit chain. Tracked: PR #253 deep-review F5/F6.
security:
  sanitizer_action: "passthrough"
