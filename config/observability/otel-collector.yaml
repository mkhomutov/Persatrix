# Persatrix — OpenTelemetry Collector reference configuration
#
# Implements the tail-sampling pipeline documented in
# RFC 0019 § H (docs/rfcs/0019-opentelemetry-completion.md#h-sampling-back-pressure-and-the-collector-pipeline).
#
# Path convention: lives under config/ alongside the rest of the operator-facing
# configuration files (per PR #160 review). docker-compose.yaml mounts this file
# into the otel-collector service. Production operators are expected to fork
# this config and point their own Collector at their own backends; the version
# checked in here is the dev/CI default that backs `docker compose up -d`.
#
# Signals: traces (OTLP -> tail-sampling -> Jaeger), metrics (OTLP -> Prometheus),
# logs (OTLP -> Loki). Every signal carries the schema_url
# https://persatrix.dev/schemas/observability/1.0.0 (RFC 0019 § B).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # RFC 0019 § H — tail sampling policies.
  # decision_wait gives the Collector time to assemble all spans for a trace
  # before the policy fires; num_traces caps in-memory state so a sampling
  # storm cannot OOM the Collector.
  tail_sampling:
    decision_wait: 10s
    num_traces: 100000
    expected_new_traces_per_sec: 1000
    policies:
      # Always keep traces with errors.
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Always keep slow traces (latency >= 5s end-to-end).
      - name: slow-llm
        type: latency
        latency:
          threshold_ms: 5000
      # Always keep workflow-driven traces (anything carrying a Persatrix
      # workflow id baggage attribute).
      - name: workflow-traces
        type: string_attribute
        string_attribute:
          key: persatrix.workflow_id
          values: [".+"]
          enabled_regex_matching: true
          invert_match: false
      # Sample 1% of remaining (healthy autonomous tick) traces. Tunable for
      # v0.3 mesh load.
      - name: healthy-tick-sample
        type: probabilistic
        probabilistic:
          sampling_percentage: 1

  # Standard batching keeps exporter pressure bounded.
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Traces -> Jaeger (OTLP gRPC ingest enabled in docker-compose.yaml via
  # COLLECTOR_OTLP_ENABLED=true).
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics -> Prometheus pull endpoint scraped by the Prometheus container.
  prometheus:
    endpoint: 0.0.0.0:8889
    # Enable exemplars so histogram samples carry the originating trace_id.
    # NOTE: exemplar passthrough only reaches Prometheus query results when
    # the upstream Prometheus is started with `--enable-feature=exemplar-storage`
    # (the dev compose stack already does — see docker-compose.yaml `prometheus`
    # service `command:` block). Forks pointing at their own Prometheus must
    # enable the feature flag or exemplars will be silently dropped on scrape.
    enable_open_metrics: true

  # Logs -> Loki via the OTLP HTTP push endpoint.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Stdout fallback — opt-in only. To re-enable, add `debug` back to one
  # of the pipeline `exporters:` lists below; the Collector will then echo
  # serialised payloads to `docker compose logs otel-collector` for that
  # signal. Use this when a backend is down and operators want to read
  # traces/metrics/logs straight out of the Collector log stream.
  # Removed from steady-state pipelines per RFC 0019 PR 4 review Should-Fix
  # #4: in long-running dev sessions a `verbosity: basic` debug exporter on
  # all three pipelines floods the Collector log stream and dilutes signal
  # in incident triage.
  # NOTE: a dedicated Compose profile to toggle this without editing YAML
  # is tracked as a deferred follow-up — see docs/rfcs/0019-pr-plan.md
  # "Deferred follow-ups".
  debug:
    verbosity: basic

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
