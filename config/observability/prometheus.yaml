# Persatrix — Prometheus scrape configuration (dev only).
#
# Scrapes the OpenTelemetry Collector's Prometheus exporter (RFC 0019 § H).
# Production operators run their own Prometheus and point it at their own
# Collector deployment; this file backs the dev/CI `docker compose up -d`
# stack only.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8889]
