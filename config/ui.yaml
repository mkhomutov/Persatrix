# Web Console Configuration (RFC 0048 — operator/tester web console, v0.3.6+).
#
# Schema: schemas/ui.schema.json — `make validate` against this file.
#
# This file is the feature-toggle surface for the embedded web console served
# at /ui (orchestrator --enable-ui, default off). Each panel has a single
# operator-authored knob, `enabled`, deciding whether the console *offers* it.
#
# IMPORTANT — `available` is runtime-derived, never authored here. The server
# computes, per request, whether each panel's backing subsystem is actually
# wired (e.g. channel_timeline.available = channels are configured) and reports
# it alongside `enabled` in GET /api/v1/ui/config. The console renders a panel
# only when it is BOTH enabled here AND available at runtime. Writing an
# `available:` key in this file is a validation error (schema
# additionalProperties:false) — it would have no effect and misleads the reader.
#
# Slice 1 (v0.3.6) ships the single consolidated conversation panel
# (channel_timeline — group channels + DMs over one surface, RFC 0048
# chat-panel-retirement amendment) on; memory_strip (Slice 2) and cost (Slice 4)
# ship off so they land additively with no Slice-1 rework.
#
# A panel may also carry capability knobs. `create_enabled` (channel_timeline,
# RFC 0048 channel-creation amendment §A) opts the console into creating group
# channels from the browser — a structural write over the already-exposed
# POST /api/v1/channels. It ships ON (true) so a console-on deployment can create
# channels out of the box; set it to `false` to hide the affordance. Its
# companion `create.available` is runtime-derived (the channel store must be
# wired) and never authored here, exactly like `available` — so it still won't
# render where channels are unconfigured. (Console exposure is still gated by
# --enable-ui + the localhost bind; see the security note in the web-console
# guide before exposing the console beyond localhost.)
#
# `config_edit_enabled` (channel_timeline, RFC 0050 Phase 1) opts CLI and web
# into editing per-channel governance config at runtime — the PATCH/GET
# /api/v1/channels/{id}/config surface over the store-canonical apply path. It
# ships OFF (false) so the surface lands dark: the endpoints return 403 until an
# operator flips it on, and the server enforces this one toggle for both the CLI
# and the browser. Its companion `config_edit.available` is runtime-derived (the
# channel router must be wired) and never authored here.
panels:
  channel_timeline:
    enabled: true
    create_enabled: true
    config_edit_enabled: false
  memory_strip:
    enabled: false
  cost:
    enabled: false
