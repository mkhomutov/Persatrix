# Channel Configuration (RFC 0011 — internal channels, v0.3.0+).
#
# Schema: schemas/channel.schema.json — `make validate` against this file.
# Canonical addresses are derived at runtime as `<channel_type>:<name>`:
#   - group channels declared here address as `group:<name>`
#   - DMs open on demand under `dm:<a>:<b>` (participants lexicographically sorted)
#   - threads anchor to a parent message under `thread:<message_id>`
# Per-membership `respond` policies (`when_mentioned` | `always` | `never`)
# control the response gate; see RFC 0011 §D.

max_channels: 50

# v0.3.0 demo channel — see docs/guides/v0.3.0-demo.md for the walkthrough.
# Mixed-policy pattern from RFC 0011 §H: ember-owl is `when_mentioned` (advisor
# mode — only chimes in when @-mentioned); iron-fox + nova-sparrow are `always`
# (active collaborators that respond to every message). Cascade-depth backstop
# (default 5) caps any single chain of reactive replies, so the two `always`
# members cannot loop indefinitely. Cost expectation: a single human prompt
# typically triggers 4–8 LLM calls across the two `always` members before the
# cascade-depth backstop or natural conversation end stops it.
channels:
  - name: planning
    description: "v0.3.0 demo channel — engineering + product planning discussion"
    members:
      - id: ember-owl
        respond: when_mentioned
      - id: iron-fox
        respond: always
      - id: nova-sparrow
        respond: always
