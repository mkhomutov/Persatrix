# Channel Configuration (RFC 0011 — internal channels, v0.3.0+).
#
# Schema: schemas/channel.schema.json — `make validate` against this file.
# Canonical addresses are derived at runtime as `<channel_type>:<name>`:
#   - group channels declared here address as `group:<name>`
#   - DMs open on demand under `dm:<a>:<b>` (participants lexicographically sorted)
#   - threads anchor to a parent message under `thread:<message_id>`
# Per-membership `respond` dispositions control the response gate (RFC 0030
# relevance amendment). The recommended vocabulary is:
#   - participant — joins the open floor; speaks on un-addressed messages
#                   (subject to the v0.3.8 Tier B salience bid)
#   - chair       — a low-threshold facilitator: a `participant` that clears
#                   the salience bid readily and keeps the discussion moving
#                   (v0.3.8). A chair CANNOT close an interaction — convergence
#                   is owned by the governance layers — and its Layer 5
#                   moderator hooks are reserved/inert until v0.4.0.
#   - addressed   — speaks only when @-mentioned (or replied to in-thread)
#   - observer    — never speaks
# The legacy values `always` / `when_mentioned` / `never` still load and map
# to `participant` / `addressed` / `observer` respectively, so existing
# configs keep working unchanged; see RFC 0011 §D and RFC 0030.
#
# Per-disposition `threshold` (v0.3.8 Tier B): an optional salience bar in
# [0, 1] that an open-floor `participant`'s cheap relevance bid must clear to
# reach the (expensive) quality turn. Bias-to-silence — omit it and the member
# stays conservative on ambiguous open-floor traffic. A `chair` gets a low
# default (0.15) so it speaks readily; override per member if desired:
#   - id: facilitator
#     respond: chair
#   - id: specialist
#     respond: participant
#     threshold: 0.6      # only speaks when the bid is clearly relevant

max_channels: 50

# Interaction cost ceiling (RFC 0030 Layer 1, v0.3.8) — bound the total LLM
# spend of a single brainstorm so a conversation cannot cost unboundedly. Once
# an interaction's running token total would cross the ceiling, the wallet
# denies further leases in that interaction (fail-closed — the LLM call does not
# happen). Opt-in and additive: 0 (the default) means uncapped, so existing
# channels are unchanged. Set a fleet-wide default here and/or override per
# channel with `interaction_budget_tokens:` (the per-channel value wins; a
# channel that omits it inherits this default).
default_interaction_budget_tokens: 0

# Per-participant reply budget (RFC 0030 Layer 2, v0.3.8) — fair, finite
# turn-taking so no single participant dominates a brainstorm. With K>0, a
# participant's (K+1)th publish in one interaction is rejected pre-persistence
# (HTTP 429) and never enters channel history. Opt-in and additive: 0 (the
# default) means uncapped, so existing channels are unchanged. Set a fleet-wide
# default here and/or override per channel with
# `max_replies_per_participant_per_interaction:` (the per-channel value wins).
default_max_replies_per_participant: 0

# End-of-interaction signal (RFC 0030 Layer 4, v0.3.8) — let a brainstorm
# terminate on its own. When K distinct participants emit an END_INTERACTION_VOTE
# action within W consecutive turns, the interaction closes and the orchestrator
# stops fanning out new replies. The quorum is per channel: `end_vote_threshold`
# (K, default 2) and `end_vote_window` (W, default 3, counted in tracked
# publishes — every message, not only votes). Still opt-in and additive:
# with no agent emitting the vote action, a populated K/W never fires, so
# existing channels are unchanged. (A `chair` cannot close an interaction — only
# this vote quorum, the cost ceiling, and the depth cap can.)

# Interaction idle window (the RFC 0030 interaction-id producer, v0.3.8) —
# how long a channel can sit quiet before its next publish starts a *fresh*
# interaction (governance counters and end-votes reset; the retirement emits
# `interaction_closed{trigger=idle}`). Absent means 600s — RFC 0020's idle
# default, matching the agent-side tracker so governance and memory
# boundaries roughly coincide. An explicit 0 disables idle rotation (distinct
# from absent). Override per channel with `interaction_idle_timeout_seconds:`
# (the per-channel value wins). Thread channels always ignore it — a thread
# IS its interaction.
# default_interaction_idle_timeout_seconds: 600

# Governance (RFC 0030, v0.3.8) — fleet-wide knobs that are not per-channel.
# `exempt_principals: [human]` removes human principals (participant_type
# "user") from the Layer 2 reply budget, so a human steering the conversation
# is never throttled by the budget meant to keep agents from dominating
# (§OQ-7). Omit the block to govern everyone; the only recognised value is
# `human`.
governance:
  exempt_principals: [human]

# Floor control (RFC 0030 Layer 2.5) — ON by default for every group channel
# declared here (the floor-control amendment, v0.3.6). When a message lands in a
# channel with two or more responders, they take the floor one at a time — each
# composes its reply against a transcript that already contains the prior
# speaker's reply — instead of replying concurrently and mutually-blind. The
# trade is latency: responders go serial, each turn waiting up to
# `floor_turn_timeout_seconds` (default 45) for the speaker to compose before
# advancing. To opt a channel back out, set `floor_control: false` on it.
# See docs/guides/channels.md §7 "Floor control".

# Tier B salience bid (RFC 0030, v0.3.8) — `participant`/`chair` members run a
# cheap leased relevance bid on ambiguous open-floor traffic and stay silent
# unless they have something to add (no pile-on). `salience_max_channel_members`
# (default 20) caps it: above that many candidate responders the bid is skipped
# and open-floor members fall back to `addressed`-only, so the cost stays
# bounded on a large channel. Shown per-channel below for discoverability.

# v0.3.0 demo channel — see docs/guides/v0.3.0-demo.md for the walkthrough.
# Mixed-disposition pattern from RFC 0011 §H: ember-owl is `addressed` (advisor
# mode — only chimes in when @-mentioned); iron-fox + nova-sparrow are
# `participant` (active collaborators that join the open floor). Cascade-depth
# backstop (default 5) caps any single chain of reactive replies, so the two
# `participant` members cannot loop indefinitely. With floor control on (the
# default), the two `participant` members reply in a deterministic,
# mutually-aware round rather than shouting over each other; the call *count*
# is unchanged — a single human prompt typically triggers 4–8 LLM calls across
# the two `participant` members before the cascade-depth backstop or natural
# conversation end stops it. (Per-call prompt size for these three personas did
# grow with the v0.3.7 F-2b conversation-window bump to 40/4096 in
# config/agents.yaml — interim group-channel sizing, not RFC 0034 Phase 3.)
# (The legacy `when_mentioned` / `always` values still load and map to
# `addressed` / `participant` if you prefer them.)
channels:
  - name: planning
    description: "v0.3.0 demo channel — engineering + product planning discussion"
    # floor_control: true is the resolved default for group channels (v0.3.6);
    # shown here for discoverability. Remove or set false to opt out.
    floor_control: true
    # salience_max_channel_members: 20 is the default (RFC 0030 Tier B); shown
    # for discoverability. Lower it to disable the salience bid on larger rooms.
    salience_max_channel_members: 20
    # interaction_budget_tokens: 0 (uncapped) is the default (RFC 0030 Layer 1);
    # shown for discoverability. Set a positive token ceiling to bound the total
    # cost of one interaction on this channel; omit it to inherit
    # default_interaction_budget_tokens above.
    interaction_budget_tokens: 0
    # max_replies_per_participant_per_interaction: 0 (uncapped) is the default
    # (RFC 0030 Layer 2); shown for discoverability. Set K>0 to bound how many
    # times one participant may publish in a single interaction; omit it to
    # inherit default_max_replies_per_participant above.
    max_replies_per_participant_per_interaction: 0
    # end_vote_threshold: 2 / end_vote_window: 3 are the defaults (RFC 0030
    # Layer 4); shown for discoverability. K distinct participants emitting
    # END_INTERACTION_VOTE within W consecutive turns close the interaction.
    end_vote_threshold: 2
    end_vote_window: 3
    # escalation_chair_id (the chair-stall-escalation amendment, v0.3.8): when
    # a floor round ends with zero replies on the open interaction — every
    # participant honestly passed on an unresolved question — this member gets
    # ONE forced turn: synthesize and cast its end-of-discussion vote, or call
    # on whoever should speak next. Closing still needs the vote quorum above
    # (the chair proposes, the quorum disposes). Must be a member; omit to
    # disable escalation. nova-sparrow pairs naturally with a `chair`
    # disposition, but any participant may be the designated synthesizer.
    escalation_chair_id: nova-sparrow
    members:
      - id: ember-owl
        respond: addressed
      - id: iron-fox
        respond: participant
      - id: nova-sparrow
        respond: participant
