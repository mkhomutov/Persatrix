environment: "development"

deployment:
  mode: "local"

execution:
  deadline_mode: "derived"

observability:
  otlp:
    endpoint: "http://localhost:4318"
  content_capture:
    llm_prompts: true
    llm_responses: true
  session_replay:
    enabled: true
    retention_days: 7

testing:
  llm_mocks:
    enabled: false
    record: false

cost:
  budgets:
    global:
      max_daily_usd: 10.00
