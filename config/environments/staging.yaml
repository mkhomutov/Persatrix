environment: "staging"

deployment:
  mode: "local"

execution:
  # Valid values: "derived" (step-based deadlines) or "static" (per-executor fixed timeout).
  deadline_mode: "derived"

observability:
  otlp:
    endpoint: "http://otel-collector:4318"
  content_capture:
    llm_prompts: false
    llm_responses: true

cost:
  budgets:
    global:
      max_daily_usd: 50.00
