environment: "production"

deployment:
  mode: "hub_and_spoke"

execution:
  # Valid values: "derived" (step-based deadlines) or "static" (per-executor fixed timeout).
  # Conservative: use static mode in production until derived mode is validated in staging.
  deadline_mode: "static"

observability:
  otlp:
    endpoint: "http://otel-collector:4318"
  content_capture:
    llm_prompts: false
    llm_responses: false

cost:
  budgets:
    global:
      max_daily_usd: 500.00
      on_exceed: "hard_stop"
