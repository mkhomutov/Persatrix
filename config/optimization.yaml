# Persatrix Optimization Configuration
# schema_version 0.3 (RFC 0033 Phase 3): model identity flows exclusively
# through models.aliases — a raw vendor model ID is rejected at resolve
# (agents/model_aliases.py), not prefix-inferred. The provider_inference
# block and the _infer_provider heuristic it fed are retired.
schema_version: "0.3"

# Active profile: cost_optimized | speed_optimized | quality_optimized | simulation_optimized | custom
active_profile: "default"

# ─── Model Aliases (RFC 0033) ─────────────────────────────
# Single source of truth for model identity. Agents (config/agents.yaml),
# the routing defaults below, and the summarization model reference a
# logical alias — quality / fast / summarizer — instead of a concrete
# vendor model ID. Each resolves to a concrete (provider, model, pricing)
# record via agents/model_aliases.py resolve(). Schema:
# schemas/optimization.schema.json (models.aliases).
#
# NO DEFAULT PROVIDER (v0.3.4). These role aliases ship UNCONFIGURED:
# provider selection is always an explicit choice, never a baked-in default.
# A plain `docker compose up` therefore fails loud at agent startup until you
# pick a provider — either run a one-command demo (each mounts a per-provider
# alias config from config/demo/<provider>/optimization.yaml):
#
#   make demo-anthropic   # Claude  (needs ANTHROPIC_API_KEY)
#   make demo-openai      # GPT-4o  (needs OPENAI_API_KEY)
#   make demo-ollama      # a real local model — $0, no key, no cloud
#   make demo-offline     # scripted mock — $0, no key, no network
#
# — or configure here directly: set provider / model / pricing on each alias
# below (e.g. provider: anthropic, model: claude-sonnet-4-6, with its prices).
# Every provider is selected the same standard way; a swap is a one-line edit.
# See docs/guides/model-providers.md.
#
# Pricing: a non-local provider with no price would make the Go cost table
# (cost.pricing.models, derived from this map) read $0 and silently disable the
# RFC 0023 budget gate, so the missing-price guard (agents/model_aliases.py)
# fails closed on an unpriced *non-local* alias. Local providers (ollama / mock)
# are $0-real and carry an explicit 0. The `unconfigured` sentinel below fails
# loud on its own, before any pricing check — resolving it tells you to pick a
# provider.
models:
  aliases:
    # UNCONFIGURED by default — pick a provider (run a demo above, or replace
    # `provider` / `model` / pricing here). Resolving an `unconfigured` alias is
    # a loud, actionable error (agents/model_aliases.py) — no silent $0 routing.
    quality:
      provider: unconfigured
      model: unconfigured
      input_per_1m_tokens: 0
      output_per_1m_tokens: 0
    fast:
      provider: unconfigured
      model: unconfigured
      input_per_1m_tokens: 0
      output_per_1m_tokens: 0
    summarizer:
      provider: unconfigured
      model: unconfigured
      input_per_1m_tokens: 0
      output_per_1m_tokens: 0

default:
  model_routing:
    # RFC 0033 PR 3: routing defaults reference model aliases, not raw
    # vendor IDs. Each role resolves through models.aliases (above) at call
    # time — so the Anthropic Sonnet 4 → 4.6 retirement, or any provider
    # swap, is a one-line edit to the `quality` entry, not a sweep here.
    defaults:
      task_agents: "quality"
      sub_agents: "quality"
      evaluators: "fast"

  caching:
    exact:
      enabled: true
      max_entries: 10000
      ttl_seconds: 3600

  context_management:
    max_context_tokens: 80000
    summarization:
      enabled: true
      # RFC 0033 PR 3: the summarisation-on-close surface (RFC 0020) picks
      # its model here, separate from the provider factory. It references
      # the `summarizer` alias so a Haiku swap is also a one-alias edit;
      # agents/persona_runtime/summarize_close.py resolves it via resolve().
      model: "summarizer"

cost:
  pricing:
    # RFC 0033 §F: DERIVED from models.aliases (above) — one entry per physical
    # `model:` an alias resolves to, keyed for the Go cost pipeline
    # (internal/cost/config.go EstimateCost). It is the projection of the alias
    # map produced by agents/optimization.py derived_cost_pricing(); keep it in
    # lock-step (the optimization test TestShippedCostPricingDerivedFromAliases
    # fails on drift).
    #
    # The shipped aliases are UNCONFIGURED (no provider — see the block comment
    # above), so the projection is just the placeholder `unconfigured` model at
    # $0. No agent ever sends it: resolving an unconfigured alias fails loud
    # first. When you configure a provider here (or run a demo, which mounts a
    # configured config/demo/<provider>/optimization.yaml with its own priced
    # rows), regenerate this block from the alias map.
    models:
      "unconfigured":
        input_per_1m_tokens: 0
        output_per_1m_tokens: 0

  budgets:
    global:
      max_daily_usd: 100.00
      alert_at_percent: [50, 80, 95]
      on_exceed: "pause_and_alert"
    per_workflow:
      default_max_usd: 10.00
    per_agent:
      default_max_usd: 5.00

# ─── LLM Call Leasing wallet (RFC 0023) ───────────────────
# Server-side lease lifecycle tuning for the orchestrator's WalletService
# (internal/wallet) — the in-line gate every LLM call acquires a lease
# from before issuing. Top-level block (sibling of `cost:`), parsed by the
# Go orchestrator. An absent block, or an absent key, falls back to the
# defaults below. See RFC 0023 § B / § D and Open Question §2.
wallet:
  # Lease time-to-live, in seconds. The reaper settles a lease still
  # unsettled this long after issue at its granted (worst-case) amount, so
  # an agent crash mid-call neither leaks a provisional hold nor frees
  # spend. Default 60 = 2× the 30 s default per-call timeout (OQ §2).
  ttl_seconds: 60
  # How often, in seconds, the reaper scans for expired leases.
  reaper_interval_seconds: 5
  # Per-agent cap on concurrently-held (unsettled) leases — a DoS ceiling
  # (RFC 0023 Security Considerations), keyed on the lease-issuing agent.
  max_active_leases: 16

# ─── Conversation Window (RFC 0034 Phase 1) ───────────────
# Top-level defaults for the persona conversation-window transcript
# reconstruction. NOT a profile block — these apply regardless of
# `active_profile`. The persona runtime rebuilds the LLM `messages`
# array from the channel store each turn so the model sees the
# in-progress conversation as a transcript (closes ISSUE-0052).
# Per-agent overrides live under each agent's `conversation_window`
# block in config/agents.yaml; an omitted per-agent block inherits
# these values. Schema: schemas/optimization.schema.json.
# Wired into the runtime by RFC 0034 Phase 1 PR 3 — PR 2 ships the
# substrate + schema only.
conversation_window:
  enabled: true
  max_turns: 20
  max_tokens: 2048
