# Persatrix Optimization Configuration
schema_version: "0.1"

# Active profile: cost_optimized | speed_optimized | quality_optimized | simulation_optimized | custom
active_profile: "default"

default:
  model_routing:
    defaults:
      task_agents: "claude-sonnet-4-20250514"
      sub_agents: "claude-sonnet-4-20250514"
      evaluators: "claude-haiku-4-5-20251001"
    provider_inference:
      anthropic_prefixes:
        - "claude"
      openai_exact:
        - "o1"
        - "o3"
        - "o4"
      openai_prefixes:
        - "gpt-"
        - "o1-"
        - "o3-"
        - "o4-"

  caching:
    exact:
      enabled: true
      max_entries: 10000
      ttl_seconds: 3600

  context_management:
    max_context_tokens: 80000
    summarization:
      enabled: true
      model: "claude-haiku-4-5-20251001"

cost:
  pricing:
    models:
      "claude-sonnet-4-20250514":
        input_per_1m_tokens: 3.00
        output_per_1m_tokens: 15.00
      "claude-haiku-4-5-20251001":
        input_per_1m_tokens: 0.80
        output_per_1m_tokens: 4.00

  budgets:
    global:
      max_daily_usd: 100.00
      alert_at_percent: [50, 80, 95]
      on_exceed: "pause_and_alert"
    per_workflow:
      default_max_usd: 10.00
    per_agent:
      default_max_usd: 5.00

# ─── LLM Call Leasing wallet (RFC 0023) ───────────────────
# Server-side lease lifecycle tuning for the orchestrator's WalletService
# (internal/wallet) — the in-line gate every LLM call acquires a lease
# from before issuing. Top-level block (sibling of `cost:`), parsed by the
# Go orchestrator. An absent block, or an absent key, falls back to the
# defaults below. See RFC 0023 § B / § D and Open Question §2.
wallet:
  # Lease time-to-live, in seconds. The reaper settles a lease still
  # unsettled this long after issue at its granted (worst-case) amount, so
  # an agent crash mid-call neither leaks a provisional hold nor frees
  # spend. Default 60 = 2× the 30 s default per-call timeout (OQ §2).
  ttl_seconds: 60
  # How often, in seconds, the reaper scans for expired leases.
  reaper_interval_seconds: 5
  # Per-agent cap on concurrently-held (unsettled) leases — a DoS ceiling
  # (RFC 0023 Security Considerations), keyed on the lease-issuing agent.
  max_active_leases: 16

# ─── Conversation Window (RFC 0034 Phase 1) ───────────────
# Top-level defaults for the persona conversation-window transcript
# reconstruction. NOT a profile block — these apply regardless of
# `active_profile`. The persona runtime rebuilds the LLM `messages`
# array from the channel store each turn so the model sees the
# in-progress conversation as a transcript (closes ISSUE-0052).
# Per-agent overrides live under each agent's `conversation_window`
# block in config/agents.yaml; an omitted per-agent block inherits
# these values. Schema: schemas/optimization.schema.json.
# Wired into the runtime by RFC 0034 Phase 1 PR 3 — PR 2 ships the
# substrate + schema only.
conversation_window:
  enabled: true
  max_turns: 20
  max_tokens: 2048
