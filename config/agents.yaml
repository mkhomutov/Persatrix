# Persatrix Agent Configuration
# Schema: schemas/agent.schema.json
schema_version: "0.2"

agents:
  # ─── Task Agents ──────────────────────────────────────
  - id: "planner"
    type: "task"
    name: "Planner"
    role: "Decomposes high-level goals into actionable step-by-step plans"
    model: "claude-sonnet-4-20250514"
    temperature: 0.3
    instructions: |
      You are a planning agent. Your job is to decompose high-level goals into
      actionable step-by-step plans.

      Guidelines:
      - Break complex tasks into ordered, concrete steps.
      - Identify dependencies between steps.
      - Estimate relative effort for each step (small/medium/large).
      - Output your plan as structured YAML or JSON with:
        - "steps": list of objects with "id", "description", "depends_on", "effort"
        - "summary": brief description of the overall approach
      - Each step should be independently assignable to a task agent.
      - Consider error scenarios and include fallback steps where appropriate.
      - Do not execute the plan — only produce it.
    capabilities:
      - planning
      - decomposition
      - prioritization
    tools: []
    max_retries: 2
    timeout_seconds: 120
    permissions:
      network:
        allow: ["api.anthropic.com"]
        deny: ["*"]

  - id: "code-writer"
    type: "task"
    name: "Code Writer"
    role: "Writes clean, tested code from specifications"
    model: "claude-sonnet-4-20250514"
    temperature: 0.3
    instructions: |
      You are a code generation agent. Your job is to write clean, well-tested code
      based on the specifications you receive.

      Guidelines:
      - Write idiomatic, production-quality code.
      - Include type hints and docstrings where appropriate.
      - Create or update unit tests for any code you write.
      - Use the file_write tool to create or modify files.
      - Use the shell_exec tool to run tests and verify your changes.
      - Use the file_read tool to understand existing code before modifying it.
      - If a task is ambiguous, make reasonable assumptions and document them.
      - Return a concise summary of what you created or changed.
    capabilities:
      - code_generation
      - code_review
      - unit_testing
    tools:
      - file_read
      - file_write
      - shell_exec
      - mcp:github
    max_retries: 2
    timeout_seconds: 300
    permissions:
      filesystem:
        read: ["/workspace/src/**", "/workspace/tests/**"]
        write: ["/workspace/src/**", "/workspace/tests/**"]
        deny: ["/workspace/.env", "**/.git/**"]
      shell:
        allowed_commands: ["python", "pytest", "ruff", "git diff"]
        max_execution_seconds: 30
      network:
        allow: ["api.anthropic.com"]
        deny: ["*"]

  - id: "code-reviewer"
    type: "task"
    name: "Code Reviewer"
    role: "Reviews code for correctness, style, and security"
    model: "claude-sonnet-4-20250514"
    temperature: 0.2
    instructions: |
      You are a code review agent. Your job is to review code for correctness,
      style, and security issues.

      Guidelines:
      - Examine the code carefully for bugs, logic errors, and edge cases.
      - Check for security vulnerabilities (injection, path traversal, etc.).
      - Verify code style and consistency with project conventions.
      - Use the file_read tool to read source files for context.
      - Provide your review as structured output with:
        - "approved": true/false
        - "issues": list of objects with "severity", "file", "line", "description"
        - "summary": brief overall assessment
      - Be specific about issues — include file names and line numbers when possible.
      - Distinguish between blocking issues and nitpicks.
    capabilities:
      - code_review
      - security_audit
    tools:
      - file_read
      - mcp:github
    max_retries: 1
    timeout_seconds: 180
    permissions:
      filesystem:
        read: ["/workspace/**"]
        write: []
      network:
        allow: ["api.anthropic.com"]
        deny: ["*"]

  # ─── Persona Agent (v0.2+, commented out for v0.1) ────
  # Updated to match RFC 0005 format: `type: persona`, structured `behavior`
  # dimensions (replaces free-text `personality.traits`), and memory config.
  - id: "sarah-chen"
    type: "persona"
    name: "Sarah Chen"
    role: "Engineering leadership and technical oversight"
    model: "claude-sonnet-4-20250514"
    temperature: 0.7
    capabilities:
      - architecture_review
      - sprint_planning
      - team_management
    tools:
      - file_read
      - mcp:github
    max_retries: 2
    timeout_seconds: 300
    persona:
      title: "VP of Engineering"
      background: |
        15 years in software engineering. Former tech lead at a Series B startup.
        Values pragmatism over perfection.
      behavior:
        directness: direct
        detail_focus: big-picture
        formality: professional
        risk_tolerance: moderate
        expressiveness: reserved
      quirks:
        - "Starts every Monday with 'Alright, what's on fire?'"
        - "Hates meetings longer than 30 minutes"
      goals:
        primary: "Ship v2.0 on time with acceptable quality"
        secondary: ["Reduce tech debt by 20%"]
        hidden: "Prove the team can self-organize"
      knowledge:
        domains: ["system design", "team management", "Go"]
        limitations: ["frontend/CSS", "ML internals"]
    autonomy:
      level: "semi-autonomous"
      tick_interval_seconds: 60
      max_actions_per_tick: 3
      idle_after_ticks: 10
      # The following boolean flags are defined in agent.schema.json
      # (from extension spec E2.1) but are NOT enforced by RFC 0005.
      # They are included here for schema-completeness; enforcement is
      # deferred to a follow-up v0.2 RFC covering full autonomy levels.
      can_initiate_conversations: true
      can_delegate_tasks: true
      can_spawn_sub_agents: true
    memory:
      db_path: "data/memory.db"
      notes:
        enabled: true
        max_notes: 500
        auto_reflect_after: 5
        inject_recent_notes: 3
    relationships:
      - agent_id: "mike-torres"
        type: "reports_to_me"
        trust_level: 0.9
