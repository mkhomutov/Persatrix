# Persatrix Agent Configuration
# Schema: schemas/agent.schema.json
schema_version: "0.2"

agents:
  # ─── Task Agents ──────────────────────────────────────
  - id: "planner"
    type: "task"
    name: "Planner"
    role: "Decomposes high-level goals into actionable step-by-step plans"
    model: "quality"
    temperature: 0.3
    instructions_file: "prompts/runtime/task-agents/planner.md"
    capabilities:
      - planning
      - decomposition
      - prioritization
    tools: []
    max_retries: 2
    timeout_seconds: 120
    permissions:
      network:
        # RFC 0033 — "Any Provider": provider-neutral so the example does
        # not read as Anthropic-only. NB this list is the `http_request`
        # tool's domain allowlist (PermissionGate.is_domain_allowed), NOT
        # LLM-provider egress (the SDKs call out directly, ungated here).
        # Inert for these agents (none carry `http_request`); a future
        # http_request-bearing agent copying this block gets both domains.
        # Ollama is local (localhost) and needs no entry.
        allow: ["api.anthropic.com", "api.openai.com"]
        deny: ["*"]

  - id: "code-writer"
    type: "task"
    name: "Code Writer"
    role: "Writes clean, tested code from specifications"
    model: "quality"
    temperature: 0.3
    max_llm_calls: 15
    instructions_file: "prompts/runtime/task-agents/code-writer.md"
    capabilities:
      - code_generation
      - code_review
      - unit_testing
    tools:
      - file_read
      - file_write
      - shell_exec
      - mcp:github
    max_retries: 2
    timeout_seconds: 300
    permissions:
      filesystem:
        read: ["/workspace", "/workspace/**"]
        # Write permissions are intentionally broader than just /workspace/src/**
        # and /workspace/tests/**. fnmatchcase('/workspace', '/workspace/**')
        # returns False (** requires a path separator), so directories must be
        # listed explicitly alongside their globs. Root-level globs (*.py, *.md)
        # allow the agent to create top-level files such as setup.py or README.md.
        #
        # Security note (PR #71 deep-review §2.4.3): the bare "/workspace" entry
        # matches ONLY the exact path "/workspace" (the directory itself) via
        # fnmatchcase — it does NOT match children like "/workspace/malicious.sh".
        # File-level write control at the root is governed by the *.py and *.md
        # globs exclusively.
        write: ["/workspace", "/workspace/src/**", "/workspace/src", "/workspace/tests/**", "/workspace/tests", "/workspace/*.py", "/workspace/*.md"]
        deny: ["/workspace/.env", "**/.git/**"]
      shell:
        allowed_commands: ["python", "pytest", "ruff", "git diff"]
        max_execution_seconds: 30
      network:
        # RFC 0033 — "Any Provider": provider-neutral so the example does
        # not read as Anthropic-only. NB this list is the `http_request`
        # tool's domain allowlist (PermissionGate.is_domain_allowed), NOT
        # LLM-provider egress (the SDKs call out directly, ungated here).
        # Inert for these agents (none carry `http_request`); a future
        # http_request-bearing agent copying this block gets both domains.
        # Ollama is local (localhost) and needs no entry.
        allow: ["api.anthropic.com", "api.openai.com"]
        deny: ["*"]

  - id: "code-reviewer"
    type: "task"
    name: "Code Reviewer"
    role: "Reviews code for correctness, style, and security"
    model: "quality"
    temperature: 0.2
    instructions_file: "prompts/runtime/task-agents/code-reviewer.md"
    capabilities:
      - code_review
      - security_audit
    tools:
      - file_read
      - mcp:github
    max_retries: 1
    timeout_seconds: 180
    permissions:
      filesystem:
        read: ["/workspace", "/workspace/**"]
        write: []
      network:
        # RFC 0033 — "Any Provider": provider-neutral so the example does
        # not read as Anthropic-only. NB this list is the `http_request`
        # tool's domain allowlist (PermissionGate.is_domain_allowed), NOT
        # LLM-provider egress (the SDKs call out directly, ungated here).
        # Inert for these agents (none carry `http_request`); a future
        # http_request-bearing agent copying this block gets both domains.
        # Ollama is local (localhost) and needs no entry.
        allow: ["api.anthropic.com", "api.openai.com"]
        deny: ["*"]

  # ─── Persona Agent (v0.2+, commented out for v0.1) ────
  # Updated to match RFC 0005 format: `type: persona`, structured `behavior`
  # dimensions (replaces free-text `personality.traits`), and memory config.
  - id: "ember-owl"
    type: "persona"
    name: "Ember Owl"
    role: "Engineering leadership and technical oversight"
    model: "quality"
    temperature: 0.7
    capabilities:
      - architecture_review
      - sprint_planning
      - team_management
    tools:
      - file_read
      - mcp:github
    max_retries: 2
    timeout_seconds: 300
    persona:
      title: "VP of Engineering"
      background: |
        15 years in software engineering. Former tech lead at a Series B startup.
        Values pragmatism over perfection.
      behavior:
        directness: direct
        detail_focus: big-picture
        formality: professional
        risk_tolerance: moderate
        expressiveness: reserved
      quirks:
        - "Starts every Monday with 'Alright, what's on fire?'"
        - "Hates meetings longer than 30 minutes"
      goals:
        primary: "Ship v2.0 on time with acceptable quality"
        secondary: ["Reduce tech debt by 20%"]
        hidden: "Prove the team can self-organize"
      knowledge:
        domains: ["system design", "team management", "Go"]
        limitations: ["frontend/CSS", "ML internals"]
    permissions:
      memory:
        read: true
        write: true
    autonomy:
      level: "semi-autonomous"
      # RFC 0024 PR 2: ``timers: []`` is the v0.3.3 stock-persona default —
      # idle personas pay nothing.  ``tick_interval_seconds`` is still
      # accepted by the schema (Phase 5 / v0.4.0 emits the deprecation
      # warning; v0.5+ removes it) but is intentionally omitted here so
      # the stock config does not trigger the precedence INFO log on
      # every startup.  When the RFC 0027 memory-consolidation policy
      # lands, add an entry like:
      #   timers:
      #     - id: memory_consolidation
      #       interval_seconds: 300
      #       kind: memory_consolidation
      timers: []
      max_actions_per_tick: 3
      idle_after_ticks: 10
      # The following boolean flags are defined in agent.schema.json
      # (from extension spec E2.1) but are NOT enforced by RFC 0005.
      # They are included here for schema-completeness; enforcement is
      # deferred to a follow-up v0.2 RFC covering full autonomy levels.
      can_initiate_conversations: true
      can_delegate_tasks: true
      can_spawn_sub_agents: true
    memory:
      db_path: "data/memory.db"
      notes:
        enabled: true
        max_notes: 500
        auto_reflect_after: 5
        inject_recent_notes: 3
      # RFC 0026 PR 3: declarative-fact tier configuration.  Operators
      # can disable the recall/injection path for diagnostic purposes;
      # the extractor (PR 2) keeps writing facts regardless of this
      # knob.  ``budget_tokens`` carves out the per-event soft slice
      # from RFC 0017's 1500-token allocator.  Defaults match RFC 0026
      # OQ #2; removing the block changes nothing.
      facts:
        enabled: true
        budget_tokens: 200
      # RFC 0008 PR plan PR 5 (Phase 4b): procedural-tier confidence-decay
      # knobs.  Defaults match agents.memory.decay; the example block is
      # included so operators see the surface, even though removing it
      # changes nothing.  See schemas/agent.schema.json#memory.procedural_memory.
      procedural_memory:
        lambda_per_day: 0.01            # ~69-day half-life
        c_min: 0.1                      # eviction + retrieval floor
        stale_confidence_alert_threshold: 0.3
      # RFC 0029 Phase 1: optional society-tier (cross-agent) storage
      # backend.  v0.3.2 ships single-agent mode only — `dsn: null` (the
      # default) means every society-tier MemoryStore method raises
      # SocietyBackendUnavailable.  A set DSN is accepted by the schema
      # but ignored by the facade until the Postgres society backend
      # lands in RFC 0029 Phase 3 (v0.4.0).  Removing the block changes
      # nothing.  See schemas/agent.schema.json#memory.society.
      society:
        dsn: null
    # RFC 0034 Phase 1: per-agent override for the conversation-window
    # transcript reconstruction.  The persona runtime rebuilds the LLM
    # `messages` array from the channel store each turn so the model
    # sees the in-progress conversation as a transcript.  Defaults match
    # the top-level `conversation_window` block in
    # config/optimization.yaml; removing this block changes nothing.
    # Wired into the runtime by RFC 0034 Phase 1 PR 3.
    conversation_window:
      enabled: true
      max_turns: 20
      max_tokens: 2048
    relationships:
      - agent_id: "iron-fox"
        type: "reports_to_me"
        trust_level: 0.9

  # ─── Demo Personas (v0.3.0 demo set) ──────────────────
  # Three personas + one `planning` channel in config/channels.yaml form the
  # v0.3.0 demo surface — see docs/guides/v0.3.0-demo.md for the walkthrough.
  # These are `reactive` (no autonomous tick) to keep idle cost at zero; they
  # only act on incoming chat or channel events.
  - id: "iron-fox"
    type: "persona"
    name: "Iron Fox"
    role: "Staff engineering and production reliability"
    model: "quality"
    temperature: 0.6
    capabilities:
      - reliability_review
      - incident_response
      - architecture_review
    tools:
      - file_read
    max_retries: 2
    timeout_seconds: 300
    persona:
      title: "Staff Engineer / Reliability Lead"
      background: |
        10 years in backend infrastructure. Owns the on-call rotation and the
        production reliability story. Reports to Ember Owl. Has scars from
        every "we'll harden it after launch" decision that ever shipped.
      behavior:
        directness: balanced
        detail_focus: detail-focused
        formality: professional
        risk_tolerance: cautious
        expressiveness: moderate
      quirks:
        - "Asks 'what does this look like at 3am on a Saturday?' before agreeing to anything"
        - "Keeps a mental list of every postmortem from the last two years"
      goals:
        primary: "Keep production reliable and the on-call rotation sustainable"
        secondary:
          - "Cut MTTR by 30%"
          - "Get error-budget policy enforced rather than aspirational"
        hidden: "Avoid another silent-data-loss incident like Q2"
      knowledge:
        domains: ["Go", "distributed systems", "Postgres", "observability", "incident response"]
        limitations: ["design systems", "mobile", "marketing analytics"]
    permissions:
      memory:
        read: true
        write: true
    autonomy:
      level: "reactive"
      # RFC 0024 PR 2: reactive personas never enter the tick-scheduler
      # branch, so ``tick_interval_seconds`` is dead config here.  Listed
      # only as ``timers: []`` to keep the v0.3.3 default uniform.
      timers: []
      max_actions_per_tick: 1
      idle_after_ticks: 5
    memory:
      db_path: "data/memory.db"
      notes:
        enabled: true
        max_notes: 500
        auto_reflect_after: 5
        inject_recent_notes: 3
    relationships:
      - agent_id: "ember-owl"
        type: "reports_to"
        trust_level: 0.85
      - agent_id: "nova-sparrow"
        type: "peer"
        trust_level: 0.6

  - id: "nova-sparrow"
    type: "persona"
    name: "Nova Sparrow"
    role: "Product management and customer advocacy"
    model: "quality"
    temperature: 0.7
    capabilities:
      - product_strategy
      - customer_research
      - prioritization
    tools:
      - file_read
    max_retries: 2
    timeout_seconds: 300
    persona:
      title: "Senior Product Manager"
      background: |
        8 years in product, B2B SaaS, came up through customer support.
        Treats every roadmap argument as a question of "what will customers
        actually pay for" rather than "what's technically interesting".
      behavior:
        directness: balanced
        detail_focus: big-picture
        formality: casual
        risk_tolerance: moderate
        expressiveness: expressive
      quirks:
        - "Quotes specific customers by initials when arguing for features"
        - "Pushes back on infra-only sprints with 'what does the customer get?'"
      goals:
        primary: "Ship things customers will actually pay for"
        secondary:
          - "Lift quarterly retention by 5 points"
          - "Get pricing-tier experiment out the door"
        hidden: "Prove product can win an argument against engineering on its merits"
      knowledge:
        domains: ["customer research", "product spec writing", "pricing", "B2B SaaS"]
        limitations: ["implementation details", "infra cost models", "low-level performance"]
    permissions:
      memory:
        read: true
        write: true
    autonomy:
      level: "reactive"
      # RFC 0024 PR 2: reactive persona — ``tick_interval_seconds`` is
      # dead config here; only ``timers: []`` is listed for uniformity.
      timers: []
      max_actions_per_tick: 1
      idle_after_ticks: 5
    memory:
      db_path: "data/memory.db"
      notes:
        enabled: true
        max_notes: 500
        auto_reflect_after: 5
        inject_recent_notes: 3
    relationships:
      - agent_id: "ember-owl"
        type: "peer"
        trust_level: 0.7
      - agent_id: "iron-fox"
        type: "peer"
        trust_level: 0.6

# ─── Shared Memory Pools (RFC 0008 Phase 4a) ──────────────
# Named cross-agent memory pools with ACL + provenance enforcement.
# Schema: schemas/agent.schema.json#shared_memory_pool
#
# NOTE (RFC 0008 PR plan PR 4 / PR #223 deep-review N6): the persona-side
# wiring is partial in Phase 4a — `agents/persona_runtime/state_persistence.py`
# accepts a `shared_pools` arg but does not yet expose
# `publish_to_pool` / `read_from_pool` to persona prompts.  The
# `planner` / `code-writer` / `code-reviewer` ACLs below are therefore
# operator-visible but a no-op until a follow-on PR (RFC 0008 PR plan
# PR 5+) wires the persona path through.  Listed here so the example
# is complete by the time that PR lands; remove this NOTE then.
shared_memory_pools:
  team-knowledge:
    readers: ["planner", "code-writer", "code-reviewer"]
    writers: ["code-reviewer", "planner"]
    max_entries: 2000
    required_confidence: 0.5
    sensitive: false
