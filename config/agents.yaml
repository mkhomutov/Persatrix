# Persatrix Agent Configuration
# Schema: schemas/agent.schema.json
schema_version: "0.2"

agents:
  # ─── Task Agents ──────────────────────────────────────
  - id: "planner"
    type: "task"
    name: "Planner"
    role: "Decomposes high-level goals into actionable step-by-step plans"
    model: "claude-sonnet-4-20250514"
    temperature: 0.3
    instructions_file: "prompts/runtime/task-agents/planner.md"
    capabilities:
      - planning
      - decomposition
      - prioritization
    tools: []
    max_retries: 2
    timeout_seconds: 120
    permissions:
      network:
        allow: ["api.anthropic.com"]
        deny: ["*"]

  - id: "code-writer"
    type: "task"
    name: "Code Writer"
    role: "Writes clean, tested code from specifications"
    model: "claude-sonnet-4-20250514"
    temperature: 0.3
    max_llm_calls: 15
    instructions_file: "prompts/runtime/task-agents/code-writer.md"
    capabilities:
      - code_generation
      - code_review
      - unit_testing
    tools:
      - file_read
      - file_write
      - shell_exec
      - mcp:github
    max_retries: 2
    timeout_seconds: 300
    permissions:
      filesystem:
        read: ["/workspace", "/workspace/**"]
        # Write permissions are intentionally broader than just /workspace/src/**
        # and /workspace/tests/**. fnmatchcase('/workspace', '/workspace/**')
        # returns False (** requires a path separator), so directories must be
        # listed explicitly alongside their globs. Root-level globs (*.py, *.md)
        # allow the agent to create top-level files such as setup.py or README.md.
        #
        # Security note (PR #71 deep-review §2.4.3): the bare "/workspace" entry
        # matches ONLY the exact path "/workspace" (the directory itself) via
        # fnmatchcase — it does NOT match children like "/workspace/malicious.sh".
        # File-level write control at the root is governed by the *.py and *.md
        # globs exclusively.
        write: ["/workspace", "/workspace/src/**", "/workspace/src", "/workspace/tests/**", "/workspace/tests", "/workspace/*.py", "/workspace/*.md"]
        deny: ["/workspace/.env", "**/.git/**"]
      shell:
        allowed_commands: ["python", "pytest", "ruff", "git diff"]
        max_execution_seconds: 30
      network:
        allow: ["api.anthropic.com"]
        deny: ["*"]

  - id: "code-reviewer"
    type: "task"
    name: "Code Reviewer"
    role: "Reviews code for correctness, style, and security"
    model: "claude-sonnet-4-20250514"
    temperature: 0.2
    instructions_file: "prompts/runtime/task-agents/code-reviewer.md"
    capabilities:
      - code_review
      - security_audit
    tools:
      - file_read
      - mcp:github
    max_retries: 1
    timeout_seconds: 180
    permissions:
      filesystem:
        read: ["/workspace", "/workspace/**"]
        write: []
      network:
        allow: ["api.anthropic.com"]
        deny: ["*"]

  # ─── Persona Agent (v0.2+, commented out for v0.1) ────
  # Updated to match RFC 0005 format: `type: persona`, structured `behavior`
  # dimensions (replaces free-text `personality.traits`), and memory config.
  - id: "ember-owl"
    type: "persona"
    name: "Ember Owl"
    role: "Engineering leadership and technical oversight"
    model: "claude-sonnet-4-20250514"
    temperature: 0.7
    capabilities:
      - architecture_review
      - sprint_planning
      - team_management
    tools:
      - file_read
      - mcp:github
    max_retries: 2
    timeout_seconds: 300
    persona:
      title: "VP of Engineering"
      background: |
        15 years in software engineering. Former tech lead at a Series B startup.
        Values pragmatism over perfection.
      behavior:
        directness: direct
        detail_focus: big-picture
        formality: professional
        risk_tolerance: moderate
        expressiveness: reserved
      quirks:
        - "Starts every Monday with 'Alright, what's on fire?'"
        - "Hates meetings longer than 30 minutes"
      goals:
        primary: "Ship v2.0 on time with acceptable quality"
        secondary: ["Reduce tech debt by 20%"]
        hidden: "Prove the team can self-organize"
      knowledge:
        domains: ["system design", "team management", "Go"]
        limitations: ["frontend/CSS", "ML internals"]
    permissions:
      memory:
        read: true
        write: true
    autonomy:
      level: "semi-autonomous"
      tick_interval_seconds: 60
      max_actions_per_tick: 3
      idle_after_ticks: 10
      # The following boolean flags are defined in agent.schema.json
      # (from extension spec E2.1) but are NOT enforced by RFC 0005.
      # They are included here for schema-completeness; enforcement is
      # deferred to a follow-up v0.2 RFC covering full autonomy levels.
      can_initiate_conversations: true
      can_delegate_tasks: true
      can_spawn_sub_agents: true
    memory:
      db_path: "data/memory.db"
      notes:
        enabled: true
        max_notes: 500
        auto_reflect_after: 5
        inject_recent_notes: 3
    relationships:
      - agent_id: "iron-fox"
        type: "reports_to_me"
        trust_level: 0.9

# ─── Shared Memory Pools (RFC 0008 Phase 4a) ──────────────
# Named cross-agent memory pools with ACL + provenance enforcement.
# Schema: schemas/agent.schema.json#shared_memory_pool
shared_memory_pools:
  team-knowledge:
    readers: ["planner", "code-writer", "code-reviewer"]
    writers: ["code-reviewer", "planner"]
    max_entries: 2000
    required_confidence: 0.5
    sensitive: false
