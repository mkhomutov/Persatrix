# cargo-deny configuration for Persatrix Rust CLI
# https://embarkstudios.github.io/cargo-deny/
#
# This file configures automated dependency auditing for the Rust CLI crate.
# CI enforces these policies via the scheduled-audit workflow.
#
# Policy Summary:
# - [advisories]  Security vulnerabilities FAIL CI (exceptions documented below)
# - [licenses]    Unknown/denied licenses FAIL CI (allow-list approach)
# - [bans]        Duplicate dependencies WARN
# - [sources]     Non-crates.io sources FAIL CI (strict source control)
#
# Run locally:
#   cd cli && cargo deny check advisories bans sources licenses
#
# Adding exceptions:
# - Only add exceptions with clear justification and TODO follow-up
# - Prefer fixing root cause (upgrade deps) over adding exceptions
# - Document why exception is needed and when it can be removed

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # RUSTSEC-2026-0173 — proc-macro-error2 is unmaintained (not a vulnerability;
    # informational "unmaintained" advisory). Pulled in transitively and only at
    # compile time: tabled_derive 0.11 (the latest release) → proc-macro-error2.
    # There is no safe upgrade — tabled 0.21 (also latest) still depends on
    # tabled_derive 0.11, and we rely on tabled's `#[derive(Tabled)]` throughout
    # the CLI, so dropping the derive feature is not viable. Zero runtime impact.
    # TODO(2026-09-15): re-check; drop this once tabled_derive migrates off
    # proc-macro-error2 (upstream: GnomedDev/proc-macro-error-2#17).
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
exceptions = [
    # Persatrix itself ships under BUSL-1.1. The allow-list above governs
    # third-party dependencies; our own crate needs an explicit exception so
    # cargo-deny doesn't reject the workspace root.
    { allow = ["BUSL-1.1"], crate = "persatrix" },
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# testing_table 0.3.x is a production (non-dev) transitive dep pulled in by
# tabled 0.20 (introduced in PR #162 — RUSTSEC-2024-0370 fix). Its runtime
# impact is zero (compile-time only; it pulls only unicode-width). This is an
# upstream design decision in tabled_derive and is not an error in our tree.
# Revisit when tabled is next upgraded or replaced.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
