# cargo-deny configuration for Persatrix Rust CLI
# https://embarkstudios.github.io/cargo-deny/
#
# This file configures automated dependency auditing for the Rust CLI crate.
# CI enforces these policies via the scheduled-audit workflow.
#
# Policy Summary:
# - [advisories]  Security vulnerabilities FAIL CI (exceptions documented below)
# - [licenses]    Unknown/denied licenses FAIL CI (allow-list approach)
# - [bans]        Duplicate dependencies WARN
# - [sources]     Non-crates.io sources FAIL CI (strict source control)
#
# Run locally:
#   cd cli && cargo deny check advisories bans sources licenses
#
# Adding exceptions:
# - Only add exceptions with clear justification and TODO follow-up
# - Prefer fixing root cause (upgrade deps) over adding exceptions
# - Document why exception is needed and when it can be removed

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # Add justified exceptions here with TODO follow-up dates
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
]
exceptions = []
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
