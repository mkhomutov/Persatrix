# cargo-deny configuration for Persatrix Rust CLI
# https://embarkstudios.github.io/cargo-deny/
#
# This file configures automated dependency auditing for the Rust CLI crate.
# CI enforces these policies via the scheduled-audit workflow.
#
# Policy Summary:
# - [advisories]  Security vulnerabilities FAIL CI (exceptions documented below)
# - [licenses]    Unknown/denied licenses FAIL CI (allow-list approach)
# - [bans]        Duplicate dependencies WARN
# - [sources]     Non-crates.io sources FAIL CI (strict source control)
#
# Run locally:
#   cd cli && cargo deny check -D advisory-not-detected advisories bans sources licenses
# The cargo-deny that `make check-licenses-rust` installs (0.19.0) needs rustc
# 1.88 or newer, newer than the 1.86 the CLI itself needs.
#
# Adding exceptions:
# - Only add exceptions with clear justification and TODO follow-up
# - Prefer fixing root cause (upgrade deps) over adding exceptions
# - Document why exception is needed and when it can be removed
# - The audit fails on an exception that no longer matches any crate
#   (`-D advisory-not-detected`); delete it then

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # RUSTSEC-2024-0449 — unsafe-libyaml is unmaintained (an "unmaintained"
    # notice, not a vulnerability). It is the YAML parser inside serde_yaml_ng
    # 0.10, the latest release, so no upgrade removes it. The CLI parses YAML
    # only from local files: the one `channel config import` is given, and the
    # one `channel config diff` compares against, which is
    # config/channels.yaml in the current directory unless `--file` names
    # another. `export` writes YAML. No YAML arrives from the network. Getting
    # rid of unsafe-libyaml means replacing serde_yaml_ng with a parser written
    # in safe Rust, tracked in ISSUE-0191
    # (docs/issues/ISSUE-0191-cli-yaml-parser-unmaintained.md). Drop this entry
    # in the PR that does; the audit fails once it matches nothing.
    "RUSTSEC-2024-0449",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    # A *data* licence, not a code one: the Community Data License Agreement
    # Permissive 2.0 covers `webpki-root-certs`, which is the Mozilla trusted
    # certificate-authority list republished by the rustls project as bytes
    # rather than as a program. It entered the tree with reqwest 0.13, whose
    # default TLS path is rustls-platform-verifier. CDLA-Permissive-2.0 grants
    # unrestricted use and redistribution of the data with no share-alike
    # obligation and no patent grant to worry about, so redistributing it
    # inside a BUSL-1.1 binary carries no condition we have to meet.
    "CDLA-Permissive-2.0",
]
exceptions = [
    # Persatrix itself ships under BUSL-1.1. The allow-list above governs
    # third-party dependencies; our own crate needs an explicit exception so
    # cargo-deny doesn't reject the workspace root.
    { allow = ["BUSL-1.1"], crate = "persatrix" },
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# testing_table 0.3 is a normal (non-dev) dependency of tabled itself, in
# the tree since tabled 0.20 (PR #162, the RUSTSEC-2024-0370 fix) and still
# there in tabled 0.22. It pulls in only unicode-width, and only one version
# of it is in the tree, so `skip` has nothing to list for it.
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
