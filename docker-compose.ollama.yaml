# Local-model overlay for docker-compose.yaml — runs the whole society on a
# REAL model served locally by Ollama: no API key, no cloud, no per-token spend.
#
#   make demo-ollama
#       — or —
#   docker compose -f docker-compose.yaml -f docker-compose.ollama.yaml up -d --build
#
# Provider selection is config-driven (RFC 0033 — there is no force-knob): this
# overlay mounts config/demo/optimization.ollama.yaml over the stack's
# optimization.yaml, which points the quality / fast / summarizer aliases at
# `provider: ollama` with base_url http://ollama:11434/v1 (the bundled daemon
# on the compose bridge). The factory routes every agent to
# agents.llm_ollama.OllamaProvider; no cloud SDK is constructed and no key is
# needed.
#
# Pick the model with PERSATRIX_OLLAMA_MODEL (default: llama3.2). It overrides
# BOTH the one-shot `ollama-pull` service below AND every ollama-routed agent
# (the factory applies it over the alias's model), so the pulled model and the
# agents stay in lock-step. First pull downloads a few GB into a named volume
# and can take minutes; subsequent runs reuse `ollama-models`.
#
# CPU by default. For NVIDIA GPU acceleration, uncomment the `deploy` block on
# the `ollama` service (requires the NVIDIA Container Toolkit on the host).

# The alias config is mounted into the orchestrator (cost table) and every
# agent (alias resolution).
x-ollama-config: &ollama-config
  - ./config/demo/optimization.ollama.yaml:/app/config/optimization.yaml:ro

# Pass the model override through to the agents so the factory swaps the alias
# model in lock-step with the pull. Empty (unset) ⇒ the agents use the alias's
# llama3.2 — matching the pull's default. (Model *configuration*, not a
# provider-selection knob: it only acts once an agent is routed to ollama.)
x-ollama-agent-env: &ollama-agent-env
  PERSATRIX_OLLAMA_MODEL: "${PERSATRIX_OLLAMA_MODEL:-}"

x-ollama-pull-gate: &ollama-pull-gate
  # Don't start the agent until the model is actually present.
  ollama-pull:
    condition: service_completed_successfully

services:
  # ─── Local model server (Ollama) ────────────────
  ollama:
    image: ollama/ollama:0.24.0
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    # Reached by agents on the compose bridge at ollama:11434 — not published
    # on the host by default. Uncomment to poke it from the host with
    # `curl localhost:11434/api/tags` (loopback-only, mirrors the orchestrator
    # gRPC publish hardening in docker-compose.yaml):
    # ports:
    #   - "127.0.0.1:11434:11434"
    healthcheck:
      # `ollama list` talks to the local `ollama serve` (the image's default
      # entrypoint) and exits 0 once it is accepting connections, even with no
      # models pulled yet — a valid readiness probe for the pull gate below.
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # NVIDIA GPU (optional) — needs the NVIDIA Container Toolkit on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: ["gpu"]

  # ─── One-shot model pull ─────────────────────────
  # Reuses the same image but overrides the entrypoint to pull the model
  # against the `ollama` service (OLLAMA_HOST), then exits. `restart: "no"` so
  # it does not loop; the agents gate on its successful completion.
  ollama-pull:
    image: ollama/ollama:0.24.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      PERSATRIX_OLLAMA_MODEL: "${PERSATRIX_OLLAMA_MODEL:-llama3.2}"
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$${PERSATRIX_OLLAMA_MODEL:-llama3.2}\""]
    restart: "no"

  # ─── Orchestrator + agents routed to the local model ────────
  orchestrator:
    volumes: *ollama-config

  agent-planner:
    volumes: *ollama-config
    environment: *ollama-agent-env
    depends_on: *ollama-pull-gate

  agent-coder:
    volumes: *ollama-config
    environment: *ollama-agent-env
    depends_on: *ollama-pull-gate

  agent-reviewer:
    volumes: *ollama-config
    environment: *ollama-agent-env
    depends_on: *ollama-pull-gate

  agent-ember-owl:
    volumes: *ollama-config
    environment: *ollama-agent-env
    depends_on: *ollama-pull-gate

  agent-iron-fox:
    volumes: *ollama-config
    environment: *ollama-agent-env
    depends_on: *ollama-pull-gate

  agent-nova-sparrow:
    volumes: *ollama-config
    environment: *ollama-agent-env
    depends_on: *ollama-pull-gate

volumes:
  # Persisted model blobs — survives `docker compose down` so the multi-GB
  # pull happens once. NOTE: `make reset` / `make docker-down` operate on the
  # base compose project and do NOT see this overlay-only volume, so it is
  # intentionally left intact across resets (you rarely want to re-download
  # gigabytes). To reclaim the space, pass the overlay explicitly:
  #   docker compose -f docker-compose.yaml -f docker-compose.ollama.yaml down -v
  ollama-models:
    driver: local
