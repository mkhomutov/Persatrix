# mypy configuration for the repo-root `tests/` tree (ISSUE-0062).
#
# CI type-checks the `agents/` tree via `cd agents && mypy .`, which uses
# the `[tool.mypy]` table in `agents/pyproject.toml`. That `cd` leaves the
# repo-root `tests/` tree outside mypy's scope, so test code under `tests/`
# was never type-checked.
#
# This file exists so CI can also run `mypy tests/` from the repo root.
# mypy has no config-inheritance mechanism (unlike ruff's `extend`), so the
# handful of base settings below are duplicated from `agents/pyproject.toml`
# rather than single-sourced. `warn_return_any` is deliberately NOT carried
# over: test code is mock-heavy and routinely returns `Any` from doubles, so
# the agents/ setting would be noise here — this is the per-directory
# relaxation ISSUE-0062 calls for.
[mypy]
python_version = 3.11
warn_unused_configs = True

# pytest's root conftest.py inserts `tests/` onto `sys.path` so the sibling
# helper modules import as top-level names (`_otel_test_helpers`,
# `_test_infra`). mypy does not run conftest.py, so it needs the search
# path spelled out here to resolve those imports the way pytest does.
mypy_path = tests

# `tests/` is a regular package (`tests/__init__.py` exists), so the crawl
# names every file `tests.*`. The two helpers above are ALSO reachable as
# top-level modules via `mypy_path`, and mypy rejects a file found under two
# module names ("Source file found twice"). Excluding them from the crawl
# leaves the top-level name as their only identity; they are still fully
# type-checked — mypy follows the imports from their callers.
exclude = (?x)(
    ^tests/_otel_test_helpers\.py$
    | ^tests/_test_infra\.py$
    | ^tests/_salience_reasoning_helpers\.py$
  )

# grpc_tools and mypy_protobuf are optional dev-only dependencies, probed
# inside `try/except ImportError` capability checks; neither ships type
# information. Suppress missing-import noise regardless of whether the
# package is installed in a given environment.
[mypy-grpc_tools.*]
ignore_missing_imports = True

[mypy-mypy_protobuf.*]
ignore_missing_imports = True
