# Cloud-peer overlay for docker-compose.yaml — runs the whole society on
# IBM watsonx.ai, another cloud alternative to Anthropic / OpenAI / Gemini
# ("Any Provider"). RFC 0053.
#
#   make demo-watsonx         # needs WATSONX_API_KEY in your environment / .env
#                             # AND project_id/url filled into the mounted config
#       — or —
#   docker compose -f docker-compose.yaml -f docker-compose.watsonx.yaml up -d --build
#
# Provider selection is config-driven (RFC 0033 — there is no force-knob): this
# overlay mounts config/demo/watsonx/optimization.yaml over the stack's
# optimization.yaml, which points the quality / fast / summarizer aliases at
# `provider: watsonx` (meta-llama/llama-3-3-70b-instruct / ibm/granite-3-8b-instruct).
#
# THE SECRET/CONFIG SPLIT (RFC 0053 §C/§E) — read before running:
#   • SECRET  → WATSONX_API_KEY rides compose ENV (below), the same channel the
#               other cloud keys use.
#   • CONFIG  → project_id (or space_id) + the regional url are NON-secrets the
#               client cannot be built without. They live in the MOUNTED alias
#               `provider_config` (config/demo/watsonx/optimization.yaml), NOT
#               compose env — the same place OpenAI's base_url lives and the
#               single source of truth the factory validates. YOU MUST EDIT that
#               file to fill in your project_id (it ships empty → fail-closed at
#               startup) before this demo will boot.
#
# Two differences from the openai overlay:
#   1. The native ibm-watsonx-ai SDK is an optional pyproject EXTRA (RFC 0053
#      OQ #4), so it is NOT in the base agent image. This overlay sets the
#      `AGENT_EXTRAS: watsonx` build arg (Dockerfile.agent) to install it —
#      hence `--build` is required, as `make demo-watsonx` passes.
#   2. The base compose plumbs only ANTHROPIC_API_KEY / OPENAI_API_KEY, so this
#      overlay adds WATSONX_API_KEY (the SECRET key only) to every agent.
#
# Unlike demo-offline / demo-ollama this is a REAL cloud provider: it spends
# real money and needs a key. Set a hard spending cap in IBM Cloud before
# running — see the README § Cost Warning.

# The alias config is mounted into the orchestrator (cost table) and every
# agent (alias resolution + the required project_id/url provider_config).
x-watsonx-config: &watsonx-config
  - ./config/demo/watsonx/optimization.yaml:/app/config/optimization.yaml:ro

# The SECRET key only, plumbed into every agent (the base compose plumbs only
# ANTHROPIC/OPENAI). The non-secret project_id/url live in the mounted alias
# provider_config, NOT here (RFC 0053 §C).
x-watsonx-env: &watsonx-env
  - WATSONX_API_KEY=${WATSONX_API_KEY:-}

# Install the ibm-watsonx-ai extra into the agent image (see the header note 1).
x-watsonx-build: &watsonx-build
  args:
    AGENT_EXTRAS: watsonx

services:
  orchestrator:
    volumes: *watsonx-config

  agent-planner:
    build: *watsonx-build
    volumes: *watsonx-config
    environment: *watsonx-env

  agent-coder:
    build: *watsonx-build
    volumes: *watsonx-config
    environment: *watsonx-env

  agent-reviewer:
    build: *watsonx-build
    volumes: *watsonx-config
    environment: *watsonx-env

  agent-ember-owl:
    build: *watsonx-build
    volumes: *watsonx-config
    environment: *watsonx-env

  agent-iron-fox:
    build: *watsonx-build
    volumes: *watsonx-config
    environment: *watsonx-env

  agent-nova-sparrow:
    build: *watsonx-build
    volumes: *watsonx-config
    environment: *watsonx-env
