# Persatrix — Local Development Stack
# Usage: docker compose up -d

services:
  # ─── Orchestrator (Go) ────────────────────────────
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    restart: unless-stopped
    # NOTE(review-F02): Docker 'command' replaces Dockerfile CMD entirely.
    # All required flags must be listed here, not just the override.
    # PR #173 review Must-Fix #2 defaulted --grpc-bind to 127.0.0.1 so a
    # bare binary run does not expose the unauthenticated LogService on
    # every interface. Inside the compose bridge network the agents must
    # reach the orchestrator at orchestrator:9090, so 0.0.0.0 is required
    # here.
    command: ["--config", "/app/config/", "--http-bind", "0.0.0.0", "--http-port", "8080", "--grpc-bind", "0.0.0.0", "--port", "9090", "--workflows-dir", "/app/workflows/", "--env", "development"]
    ports:
      - "9090:9090"   # gRPC
      - "8080:8080"   # HTTP REST + SSE
    volumes:
      - ./config:/app/config:ro
      - ./workflows:/app/workflows:ro
      - workspace:/workspace
      # RFC 0018 PR 5: the log buffer disk-persists sealed rings to
      # PERSATRIX_LOGBUFFER_DIR. Mount a writable named volume so the
      # non-root container user (appuser) can create per-execution
      # subdirectories and survive a container restart.
      - orchestrator-data:/var/lib/persatrix
    environment:
      # RFC 0019 PR 4: OTLP traffic flows through the Collector (tail
      # sampling + fan-out to Jaeger / Prometheus / Loki). Direct
      # orchestrator -> Jaeger wiring is replaced by the Collector hop.
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_SERVICE_NAME=persatrix-server
      # RFC 0018 PR 5: pin the log buffer disk store to a path on the
      # dedicated orchestrator-data volume. Default `data/logs` is a
      # relative path and the non-root container has no writable CWD,
      # so leaving it unset disables the entire log-service surface.
      - PERSATRIX_LOGBUFFER_DIR=/var/lib/persatrix/logs
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Agent: Planner ──────────────────────────────
  agent-planner:
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    command: ["--agent", "planner", "--port", "50051", "--host", "0.0.0.0", "--orchestrator-url", "http://orchestrator:8080", "--advertise-address", "agent-planner:50051"]
    ports:
      - "50051:50051"
    volumes:
      - ./config:/app/config:ro
      - workspace:/workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set — export it or add to .env}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - orchestrator
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('localhost', 50051), timeout=5); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Agent: Code Writer ──────────────────────────
  agent-coder:
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    command: ["--agent", "code-writer", "--port", "50052", "--host", "0.0.0.0", "--orchestrator-url", "http://orchestrator:8080", "--advertise-address", "agent-coder:50052"]
    ports:
      - "50052:50052"
    volumes:
      - ./config:/app/config:ro
      - workspace:/workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set — export it or add to .env}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - orchestrator
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('localhost', 50052), timeout=5); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Agent: Code Reviewer ────────────────────────
  agent-reviewer:
    build:
      context: .
      dockerfile: Dockerfile.agent
    restart: unless-stopped
    command: ["--agent", "code-reviewer", "--port", "50053", "--host", "0.0.0.0", "--orchestrator-url", "http://orchestrator:8080", "--advertise-address", "agent-reviewer:50053"]
    ports:
      - "50053:50053"
    volumes:
      - ./config:/app/config:ro
      - workspace:/workspace:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY must be set — export it or add to .env}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
    depends_on:
      - orchestrator
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.create_connection(('localhost', 50053), timeout=5); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Observability: OpenTelemetry Collector ──────
  # RFC 0019 § H — central tail-sampling pipeline. Traces fan out to Jaeger,
  # metrics to Prometheus, logs to Loki. Reference config under
  # config/observability/otel-collector.yaml.
  #
  # NOTE(review-PR171, Should-Fix #1): no `healthcheck:` is declared here.
  # The upstream image (`otel/opentelemetry-collector-contrib`) is distroless
  # — no shell, `wget`, `curl`, or `nc` binary is present — so a Docker
  # CMD/CMD-SHELL probe cannot be authored without rebuilding the image or
  # adding a sidecar. Without a healthcheck, depending services cannot use
  # `condition: service_healthy`, which means a cold-start `docker compose
  # up -d` may briefly race the OTLP receiver bind and drop the first batch
  # (visible as a one-off non-zero `agent.observability.{spans,logs}.dropped`
  # on first boot). Steady-state operation is unaffected: the OTLP exporters
  # batch + retry, and `restart: unless-stopped` recovers from the rare
  # post-start crash. Tracked as a follow-up in
  # docs/rfcs/0019-pr-plan.md "From PR 4 review".
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.1
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otel-collector.yaml"]
    volumes:
      - ./config/observability/otel-collector.yaml:/etc/otelcol/otel-collector.yaml:ro
    ports:
      - "4317:4317"     # OTLP gRPC ingest (host -> Collector)
      - "4318:4318"     # OTLP HTTP ingest (host -> Collector)
      - "8889:8889"     # Prometheus exporter (scraped by prometheus service)
    depends_on:
      - jaeger
      - loki

  # ─── Observability: Jaeger (traces backend) ──────
  jaeger:
    # Pin to a specific version for reproducible builds — 'latest' is
    # non-deterministic across machines and over time.
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "16686:16686"   # Jaeger UI
      # OTLP ingest is now reached through the Collector; ports are not
      # published on the host.
    expose:
      - "4317"
      - "4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true

  # ─── Observability: Prometheus (metrics backend, dev only) ─────
  prometheus:
    image: prom/prometheus:v2.55.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --enable-feature=exemplar-storage
    volumes:
      - ./config/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "9091:9090"     # Prometheus UI (host port shifted to avoid orchestrator gRPC :9090)
    # NOTE(review-PR171, Should-Fix #1): readiness probe lets the Prometheus
    # exporter scrape loop quiesce before E2E tests query against /api/v1.
    # The `/-/ready` endpoint flips to 200 once the TSDB and config have
    # loaded; `wget` ships in the busybox-based prom/prometheus image.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - otel-collector

  # ─── Observability: Loki (logs backend, dev only) ─────
  loki:
    image: grafana/loki:3.1.0
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"     # Loki HTTP API (push + query)
    # NOTE(review-PR171, Should-Fix #1): probe Loki's `/ready` so dependent
    # tests / log-shippers do not race ingester startup. `wget` is bundled
    # in the upstream `grafana/loki` image (BusyBox base).
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  workspace:
    driver: local
  # RFC 0018 PR 5: dedicated volume for the orchestrator log buffer's
  # disk-persisted sealed rings (PERSATRIX_LOGBUFFER_DIR). Separated
  # from `workspace` so it is not mounted into agent containers.
  orchestrator-data:
    driver: local
