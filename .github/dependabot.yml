# Dependabot version updates — committed so the cadence is reviewable.
#
# Until 2026-09-06 only GitHub's security updates ran (they need no config),
# which is why Go, npm and Cargo bump PRs existed with no file here. Version
# updates are deliberately quiet: once a month, one grouped PR per ecosystem,
# so a review sees one diff and CI runs once. The commit prefix matches the
# PR-title check (`commitlint.yml`): `chore(deps)` is an accepted type/scope.
# Security updates keep their own cadence regardless of this file.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

  - package-ecosystem: pip
    directory: /agents
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    open-pull-requests-limit: 2
    ignore:
      # A major bump of the Anthropic SDK is a code change, not a bump, so it
      # should not arrive as a line in the monthly sweep. 1.x removed the
      # `temperature` parameter from `messages.create`, which
      # AnthropicProvider passes on every call (agents/llm_providers.py), so
      # merging the widening would have turned every Anthropic request into a
      # TypeError raised before the request was sent. The first sweep (#870)
      # proposed exactly that, and CI went green on it: the unit tests build
      # the provider — whose constructor did not change — and mock the client
      # from there, so nothing exercised the call. Without this rule the same
      # PR returns every month for a human to refuse from memory.
      #
      # The cost is that the eventual deliberate upgrade will not be offered
      # either. Doing it means porting the provider to whatever 1.x replaced
      # `temperature` with, lifting the `<1` cap in agents/pyproject.toml, and
      # dropping this rule in the same change. Tracked in
      # docs/issues/ISSUE-0144-anthropic-sdk-pinned-below-1x.md.
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 1
