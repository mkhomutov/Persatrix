# Dependabot version updates — committed so the cadence is reviewable.
#
# Until 2026-09-06 only GitHub's security updates ran (they need no config),
# which is why Go, npm and Cargo bump PRs existed with no file here. Version
# updates are deliberately quiet: once a month, one grouped PR per ecosystem,
# so a review sees one diff and CI runs once. The commit prefix matches the
# PR-title check (`commitlint.yml`): `chore(deps)` is an accepted type/scope.
# Security updates keep their own cadence regardless of this file.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

  # The ranges in agents/pyproject.toml only. CI installs at the versions in
  # .github/python-constraints.txt, which Dependabot must not manage: it edits
  # a uv-compiled file line by line instead of re-resolving it, and so
  # proposes versions the file's other pins rule out. Those pins move through
  # .github/workflows/python-constraints-refresh.yml, which also tries a
  # widening merged here on the newest releases the day it lands. The file
  # sits outside /agents on purpose: this block reads any .txt there whose
  # lines look like requirements.
  - package-ecosystem: pip
    directory: /agents
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    open-pull-requests-limit: 2
    ignore:
      # A major bump of the Anthropic SDK is a code change, not a bump, so it
      # should not arrive as a line in the monthly sweep. 1.x removed the
      # `temperature` parameter from `messages.create`, which
      # AnthropicProvider passes to every older model that takes it
      # (agents/llm_providers.py), so
      # merging the widening would turn those requests into a TypeError
      # raised before the request is sent. The first sweep (#870)
      # proposed exactly that, and CI went green on it: the unit tests build
      # the provider — whose constructor did not change — and mock the client
      # from there, so nothing exercised the call. Without this rule the same
      # PR returns every month for a human to refuse from memory.
      #
      # The cost is that the eventual deliberate upgrade will not be offered
      # either. Doing it means porting the provider to whatever 1.x replaced
      # `temperature` with, lifting the `<1` cap in agents/pyproject.toml, and
      # dropping this rule in the same change. Tracked in
      # docs/issues/ISSUE-0144-anthropic-sdk-pinned-below-1x.md.
      - dependency-name: "anthropic"
        update-types: ["version-update:semver-major"]
      # The generated protobuf stubs are committed, and a CI gate fails the
      # build when they drift from proto/. What holds them reproducible is the
      # protobuf `<6` cap: it constrains which grpcio-tools pip may resolve
      # inside `>=1.71.2,<2`, and that is the thing that actually emits
      # `*_pb2.py`. mypy-protobuf is pinned exactly for the same reason, one
      # layer up, for the `.pyi`. Widening either turns every generated file
      # stale at once — not just the mypy-protobuf output — which is what
      # #870 and then #879 both did.
      #
      # Regenerating against a new protobuf major is real work with a
      # toolchain requirement (CLAUDE.md pins protoc and the plugins to the
      # versions CI uses), so it does not belong in a monthly sweep. Same
      # trade as the anthropic rule above: the deliberate upgrade will not be
      # offered either, and is tracked in
      # docs/issues/ISSUE-0145-proto-toolchain-pinned-to-protobuf-5x.md.
      - dependency-name: "protobuf"
        update-types: ["version-update:semver-major"]
      # Minor as well as major, unlike protobuf above. mypy-protobuf is a
      # generator, and its own pin comment records that the output differs
      # across *minor* versions — 3.5 to 3.6 swapped `typing_extensions.final`
      # for `typing.final` and rewrote the `Literal` references. A
      # major-only rule let 3.6.0 -> 3.7.0 through in #882, which duly turned
      # the three .pyi stale. Patch releases inside 3.6.x stay available.
      - dependency-name: "mypy-protobuf"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # grpcio-tools is pinned exactly in agents/pyproject.toml because it
      # emits the committed stubs. Every release above 1.71.2 requires
      # protobuf>=6, so under the cap above they cannot install at all — an
      # offer to bump the minor is an offer to break `pip install`. Patch
      # releases inside 1.71.x stay available.
      - dependency-name: "grpcio-tools"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: cargo
    directory: /cli
    schedule:
      interval: monthly
    groups:
      rust:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

  # The Rust release CI builds, lints and tests the CLI with, pinned in
  # cli/rust-toolchain.toml. Each new release arrives as one PR. CI runs
  # clippy with warnings as errors, so a lint the release adds fails that PR
  # alone instead of every open PR on release day. Dependabot edits only that
  # file, which is why the workflows install whatever it names rather than a
  # version of their own.
  - package-ecosystem: rust-toolchain
    directory: /cli
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 1

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"
    open-pull-requests-limit: 2

  # The base images of the two Dockerfiles. Until 2026-11 nothing proposed a
  # newer one, and `alpine:3.20` stayed in Dockerfile.orchestrator seven months
  # after Alpine stopped supporting it (ISSUE-0218). In the directory named,
  # the updater reads every file with "dockerfile" in its name, so both
  # Dockerfile.agent and Dockerfile.orchestrator are found at /. It moves a tag
  # only to a newer one of the same shape: `alpine:3.20` to another
  # `<major>.<minor>`, `golang:1.26-alpine` to another `<major>.<minor>-alpine`.
  # No CI job builds an image (ISSUE-0219), so green checks on one of these PRs
  # say nothing about the image: build it and start a demo before merging.
  # tests/unit/python/test_scheduled_audit.py fails when a Dockerfile lands in
  # a directory with no entry here.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2
    ignore:
      # The agent image's Python. The tag `3.12-slim` has no patch part, so the
      # only move Dependabot could offer is to another minor (`3.13-slim`), and
      # which Python the image and CI share is a choice not yet made: CI tests
      # 3.11 and the image runs 3.12
      # (docs/issues/ISSUE-0219-agent-image-is-not-what-ci-tests.md). Until it
      # is made, no move is offered. Drop this rule in the change that makes
      # the choice.
      - dependency-name: "python"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # The Node that builds the web console inside the image is pinned to the
      # lowest release web/package.json's engines range admits, the one CI's
      # web-console job installs, and
      # tests/unit/python/test_web_node_engines_floor.py fails on any other
      # tag. It moves by hand, when that range moves. A rule with a name alone
      # ignores every version.
      - dependency-name: "node"

  # The images the compose files run as published: the tracing, metrics and
  # log services in docker-compose.yaml and Ollama in
  # docker-compose.ollama.yaml. The updater reads every compose file in the
  # directory named, docker-compose.yaml and each docker-compose.<name>.yaml
  # overlay. GitHub raises no security alert and no security update for this
  # ecosystem, so this monthly PR is the only update path these images have.
  # As above, CI starts none of them: run the stack before merging.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    groups:
      compose:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 1
