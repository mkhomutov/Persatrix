# CI pipeline for Persatrix.
#
# PR review: the Makefile defines test, lint, and validate targets but no CI
# ran them, meaning PRs could merge with broken imports, syntax errors, or
# failing validation. This workflow runs the core checks on every PR and push
# to main.
#
# Scope: Go build+test, Go proto staleness check, Python lint+test,
# Rust build+clippy+test, config validation, docs hygiene, and a lightweight
# Docker build-context hygiene probe (ISSUE-0104). Full Docker product-image
# builds are excluded.
#
# 2026-09-06 (methodology series): every check that used to run only in the
# local pre-commit hook or a bare `make` target now has a CI step — gofmt,
# cargo fmt, ruff/mypy on scripts/ and evaluators/, the Go integration tests,
# the sanitizer-pattern sync, prompt_refs, and the four doc-hygiene checks.
# The hook lives outside version control and not every contributor has it,
# so a local-only check is a check the merge never sees. The enforcement
# matrix (docs/methodology/enforcement-matrix.md) lists the level of each.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Guard the //go:embed placeholder. `make ui` overwrites the tracked
      # internal/ui/assets/index.html with Vite build output that references
      # gitignored hashed bundles; if that output is ever committed, a clean
      # checkout embeds an index.html pointing at assets that aren't in git —
      # 404-ing every console asset while this Go-only lane still builds green.
      # Assert the checked-in file is still the placeholder so that mistake fails
      # CI loudly instead of shipping a broken embed.
      - name: Assert UI embed is the committed placeholder (not build output)
        run: grep -q "Web console assets are not built" internal/ui/assets/index.html

      - name: Build orchestrator
        run: go build ./cmd/orchestrator

      # Formatting used to be pre-commit-only; a contributor without the hook
      # could merge unformatted Go. Every tracked .go file, not just internal/
      # and cmd/ — tests/integration/ is Go too and this job now runs it. The
      # two-step form fails on gofmt's own error exit (a file it cannot parse
      # prints to stderr with empty stdout, which a bare `test -z` would pass).
      - name: Check gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))" || exit 1
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi

      - name: Run Go tests
        run: go test ./internal/... -v -race -cover

      # tests/integration/*_test.go (scheduler→executor over bufconn, the rate
      # limiter, the audit logger) sat outside `./internal/...` and so ran in
      # no job — the fourth "test tree with no runner" this repo has found
      # (after agents/tests/, the Rust suite, and the Python integration tier).
      # ~2 s under -race.
      - name: Run Go integration tests
        run: go test ./tests/integration/... -v -race

      # agents/security_patterns.py + security_enums.py are generated from the
      # Go canonical sources (RFC 0009 PR 3). The sync check needs `go run`, so
      # it lives in this job rather than the Python one. Was make-only.
      - name: Check generated sanitizer mirrors are in sync with Go
        run: make generate-sanitizer-patterns-check

  web-console:
    # RFC 0048 Phase 1 PR 3 — the embedded web console's JS toolchain (the
    # repo's 4th language). This is the *release/asset* lane: it runs the
    # frontend unit tests, builds the real Svelte/Vite bundle into
    # internal/ui/assets/, and confirms the orchestrator compiles with that
    # bundle embedded. The Go-only `go` job above stays Node-free and builds
    # against the committed placeholder embed, so a Go-only contributor is
    # never blocked on the JS toolchain (v0.3.6-plan §Risk).
    name: Web console (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Drive the web build through the same `make` targets the README hands
      # contributors and a release runs, so CI exercises the documented
      # interface, not a parallel set of raw npm commands. Each target is
      # self-contained (`npm ci && …`): `ui-test` installs deps and runs Vitest,
      # `ui` reinstalls and builds. The second `npm ci` is the cost of `ui`
      # being a real release-build command; it is served fast by the setup-node
      # npm cache configured above.
      # RFC 0039 enabled-mode exposure amendment §A3 — the console renders
      # LLM-authored content and the session is a cookie, so {@html} is a
      # session-riding XSS vector. The no-{@html} convention is enforced, not
      # advisory. Stdlib-only script; the runner's system python3 suffices.
      - name: Check no {@html} directive under web/src
        run: make ui-html-check

      - name: Run web console unit tests
        run: make ui-test

      - name: Build web console bundle
        run: make ui

      - name: Build orchestrator with the real bundle embedded
        run: go build ./cmd/orchestrator

  dockerignore-hygiene:
    # ISSUE-0104 regression guard. Dockerfile.orchestrator runs a clean in-image
    # `npm ci` and then `COPY web/ ./`; if `.dockerignore` fails to exclude the
    # nested `web/node_modules`, a host tree leaks into the context and clobbers
    # the clean install (on arm64 this shipped a darwin-only rollup that broke
    # `vite build`). The fix was `node_modules/` -> `**/node_modules/`.
    #
    # This guard is invisible to the other lanes for two reasons the probe
    # handles directly: (1) Docker anchors `node_modules/` to the context root,
    # so only a real `docker build` reflects the actual matcher (a string check
    # would call the buggy pattern safe); (2) a clean checkout has no
    # web/node_modules to leak, so the probe seeds a sentinel first — which is
    # exactly why the original break never tripped CI. ubuntu-latest ships
    # Docker preinstalled, so this is a few-second probe, not a product build.
    name: Dockerignore context hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Assert .dockerignore excludes nested node_modules
        run: make dockerignore-check

  proto-staleness:
    name: Proto staleness check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "34.1"  # pin to exact version to match committed stubs
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Go protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1

      - name: Regenerate Go stubs
        run: make proto-go

      - name: Check for drift
        run: git diff --exit-code internal/generated/

  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "34.1"  # pin to exact version to match committed stubs
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd agents && pip install -e ".[dev]"

      - name: Lint with ruff
        run: cd agents && ruff check .

      # ISSUE-0056: the step above runs `cd agents` first, so the repo-root
      # tests/ tree is outside ruff's scope — test code under tests/ was
      # never linted by CI. This second invocation closes that gap. It runs
      # from the repo root and picks up the root ruff.toml, which `extend`s
      # agents/pyproject.toml so both trees share one single-sourced rule set.
      - name: Lint tests/ tree with ruff
        run: ruff check tests/

      - name: Type check with mypy
        run: cd agents && mypy .

      # ISSUE-0062: the step above runs `cd agents` first, so the repo-root
      # tests/ tree is outside mypy's scope — test code under tests/ was
      # never type-checked by CI. This second invocation closes that gap. It
      # runs from the repo root and picks up the root mypy.ini, which sets
      # the mypy_path that resolves the sibling test-helper modules. The
      # type-check half of ISSUE-0056; the lint half (`ruff check tests/`)
      # shipped above.
      - name: Type check tests/ tree with mypy
        run: mypy tests/

      # ISSUE-0134: scripts/ — every pre-commit check, the generators, the hook
      # installer — was the one Python tree neither ruff nor mypy ever saw in
      # CI, so the code that enforces linting was itself unlinted (an I001 in
      # #840 was caught only by hand). evaluators/ (the RFC 0044 eval harness)
      # was covered by `make lint-python` but by no CI step. Both ride the root
      # ruff.toml / mypy.ini; mypy.ini gained `scripts` on mypy_path so the
      # generators' sibling `_doc_index` import resolves the way it does at
      # runtime.
      - name: Lint scripts/ and evaluators/ trees with ruff
        run: ruff check scripts/ evaluators/

      - name: Type check scripts/ and evaluators/ trees with mypy
        run: mypy scripts/ evaluators/

      # RFC 0045 §B — the MIT↛BUSL dependency-direction gate (Python half).
      # Runs the [tool.importlinter] forbidden contract so a leaf MIT-candidate
      # primitive (wallet client, prompt-safety kit, mock provider) that grows
      # an import into orchestrator-internal (BUSL) code fails the build — a
      # licensing leak (BUSL source under an MIT grant on the next mirror), not
      # a style nit. Hard gate, alongside the proto/license gates. The editable
      # install above resolves the `persatrix_agents` root_package the contract
      # analyses. Regression suite: tests/unit/python/test_dependency_direction_imports.py.
      - name: Check MIT↛BUSL import direction (RFC 0045)
        run: make imports-check

      # ISSUE-0017 + ISSUE-0023: lock agents/generated/*.py + *.pyi to
      # proto/*.proto. The .pyi gate already shipped (ISSUE-0017); the
      # broadened proto-python-check target now also catches hand-edits
      # to *_pb2.py / *_pb2_grpc.py and a .proto change that updated
      # the .pyi but not the actual stubs (ISSUE-0023). Drift here
      # silently masks wire-shape changes in downstream agent code, so
      # the freshness gate runs in the same job that runs mypy + ruff.
      - name: Check generated Python protobuf stubs are in sync
        run: make proto-python-check

      # ISSUE-0023: catch the deletion drift class — a proto/<name>.proto
      # was removed (or renamed) but its generated stubs survived in
      # agents/generated/ or internal/generated/. proto-python-check
      # only diffs files that exist on both sides; orphans need their
      # own gate.
      - name: Check for orphan generated protobuf artifacts
        run: make proto-orphans-check

      - name: Run unit tests
        run: python -m pytest tests/unit/python/ -v --tb=short

      # The agents/tests/ tree (422 tests) was executed by NO job:
      # the two pytest steps around this one cover tests/unit/python/ and
      # tests/integration/, and the only Makefile target that named it was
      # broken on an unregistered `--agent` flag, so it exited before
      # collection. `cd agents && ruff check .` / `mypy .` did cover the tree,
      # so it stayed lint- and type-clean while drifting out of behavioural
      # agreement with production unnoticed, through 52 commits in 180 days.
      #
      # It is not redundant with the unit tree: it holds the ONLY executable
      # coverage of observability/tracing.py, observability/grpc_logging.py
      # and memory/scheduled_wakes.py, whose function bodies tests/unit/python/
      # never enters (those modules are import-only there), plus the bulk of
      # log_shipper.py and event_loop_lifecycle.py.
      #
      # Runs from the repo root with the agents config (mirrors the
      # integration step): rootdir must be the repo root so the schema-pinning
      # tests resolve schemas/. Mirrors `make test-agents`.
      - name: Run agents unit tests
        run: python -m pytest agents/tests/ -v --tb=short -c agents/pyproject.toml

      # ISSUE-0076: CI ran only the unit suite + the single bored-persona cost
      # gate (the cost-regression-gate job below), so the rest of
      # tests/integration/ was never gated by any CI job. The v0.3.4
      # no-default-provider change (#440) shipped the base config's `summarizer`
      # alias unconfigured, which broke the close-path integration tests, and
      # the breakage reached main undetected. This step closes the gap by
      # running the full integration tier (mirrors `make test-integration`); it
      # subsumes the conditional bored-persona gate, which stays as a always-
      # present required status check + wake-path trigger in its own right.
      - name: Run integration tests
        run: PYTHONPATH="agents/generated" python -m pytest tests/integration/ -v --tb=short -c agents/pyproject.toml

      # RFC 0029 §Test Strategy — personal-tier recall latency gate. Fails
      # the build on a >20% p99/p50 regression off the committed baseline;
      # runs informational-only (exit 0) until the perf-baseline-capture
      # workflow lands tests/perf/baselines/personal_tier_latency.json.
      - name: Personal-tier recall latency gate
        run: python tests/perf/personal_tier_latency.py

  cost-regression-gate:
    # RFC 0024 §Test Strategy — the "bored persona" cost-regression gate is
    # *the* v0.3.3 "Idle Truly Idle" acceptance. It is a release-blocker, not
    # a nightly: a regression that re-introduces the polling-cost class
    # (v0.2.1 leak) re-enters via any file in the trigger set below, so the
    # gate runs on every PR that touches one of them. The job is always
    # present (so it can be a required status check); the heavy steps run
    # only when a wake-path file changed.
    #
    # Maintenance: the trigger set is the RFC's named wake-path file set plus
    # the modules that carry wake-path behaviour as of RFC 0024 Phase 4. A
    # future PR introducing a new wake-path module MUST extend this list in
    # the same PR (RFC 0024 §Test Strategy; v0.3.3-plan Risk row 4).
    name: Cost regression gate (bored persona)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # paths-filter needs history for push-event diffs

      - name: Detect wake-path changes
        id: changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            wake_path:
              - 'agents/event_loop.py'
              - 'agents/event_loop_salience.py'
              - 'agents/event_loop_timers.py'
              - 'agents/tick.py'
              - 'agents/dispatch.py'
              - 'agents/action_executor.py'
              - 'agents/chat_reply.py'
              - 'agents/persona.py'
              - 'agents/persona_runtime/**'
              - 'agents/memory/**'
              - 'agents/server_persona.py'
              - 'agents/server_servicers.py'
              - 'agents/observability/metrics.py'
              - 'agents/observability/_metrics_wakes.py'
              - 'tests/integration/test_bored_persona_cost.py'

      - uses: actions/setup-python@v7
        if: steps.changes.outputs.wake_path == 'true'
        with:
          python-version: "3.11"

      - name: Install protoc
        if: steps.changes.outputs.wake_path == 'true'
        uses: arduino/setup-protoc@v3
        with:
          version: "34.1"  # pin to exact version to match committed stubs
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.changes.outputs.wake_path == 'true'
        run: |
          python -m pip install --upgrade pip
          cd agents && pip install -e ".[dev]"

      - name: Bored-persona cost-regression gate
        if: steps.changes.outputs.wake_path == 'true'
        run: python -m pytest tests/integration/test_bored_persona_cost.py -v --tb=short

  rust:
    name: Rust (build + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build CLI
        run: cd cli && cargo build

      # Was pre-commit-only (see the gofmt note in the Go job).
      - name: Check rustfmt
        run: cd cli && cargo fmt -- --check

      - name: Clippy
        run: cd cli && cargo clippy -- -D warnings

      # The Rust suite carries the CLI↔server lockstep guards (the config-knob
      # set and its wire types are parsed out of the Go sources), so leaving it
      # to the manual pre-tag sweep meant a knob could ship with no CLI surface
      # and a red guard for a whole cycle — which is exactly what ISSUE-0114 did
      # (v0.3.13 release-prep PR 1 finding). The job name is left unchanged so an
      # existing required-status-check rule keeps matching.
      - name: Test
        run: cd cli && cargo test

  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    needs: [python]  # needs agent deps installed
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd agents && pip install -e ".[dev]"

      - name: Validate YAML configs
        run: python agents/validate.py config/

      # `make validate` runs this after the schema pass; CI called
      # agents/validate.py directly and skipped it, so a persona whose
      # `instructions_file` pointed at a missing prompt validated green.
      - name: Check agents.yaml instructions_file references resolve
        run: python scripts/checks/prompt_refs.py

      - name: Check issues index is up to date
        run: make issues-check

      - name: Check RFCs index is up to date
        run: make rfcs-check

  docs-hygiene:
    # The documentation checks the pre-commit hook runs (links + anchors,
    # leaked tool-call markup, status markers, FILEMAP freshness, merged-PR
    # history, plan status) had no CI counterpart, so a checkout without the
    # hook — or a `--no-verify` — could merge a broken link or a stale file map
    # (ISSUE-0133: the #840 worktree corruption would have merged a wrong
    # FILEMAP.md unnoticed). All are stdlib-only; the runner's system python3
    # suffices. Full history is fetched because the last two read `git log`.
    name: Docs hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # merged-prs + plan-status read the whole first-parent log

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check documentation links and anchors
        run: python scripts/checks/doc_links.py

      - name: Check for leaked tool-call markup in docs
        run: python scripts/checks/doc_leaked_markup.py

      - name: Check status markers
        run: python scripts/checks/doc_status_markers.py

      # Compares everything except the generation date in the header, so a
      # correct map committed yesterday does not read as stale today.
      #
      # On a pull_request event this runs on the MERGE ref (branch ∪ main), so
      # a PR that is behind a file-adding commit on main fails here until it
      # is updated and the hook regenerates the map. That is deliberate, per
      # ISSUE-0133's own analysis: it is the exact staleness the merge would
      # commit, and `main`'s required checks are already `strict` (the branch
      # must be current before it can merge), so the update is not extra work.
      # The failure message names the fix.
      - name: Check FILEMAP.md is up to date
        run: python scripts/generate_filemap.py --check

      # docs/merged-prs.md is generated from the squash-merge subjects on main
      # (the hand-kept ROADMAP table had stopped at #708 in June). Unlike
      # FILEMAP, the check tolerates being behind by the newest merges — the
      # file can never contain the merge that lands it — and fails only on a
      # hand edit or format drift. The hook catches it up on the next commit.
      - name: Check docs/merged-prs.md is up to date
        run: python scripts/merged_prs.py --check

      # A plan row that says "PR open (#N)" after #N merged is the most common
      # status-hygiene defect in the history. Checked against the same log.
      - name: Check no plan row announces an already-merged PR as open
        run: python scripts/checks/plan_status.py

      # The methodology's contract (docs/methodology/conformance.json): the
      # documents, tools, make targets and CI steps it consists of. A PR that
      # deletes a template or drops a target fails here, not in an audit.
      - name: Check the checkout conforms to the methodology manifest
        run: python scripts/checks/methodology_conformance.py

  file-size-check:
    name: File size check
    runs-on: ubuntu-latest
    steps:
      # The size gate tells a frozen (released) plan from the open cycle's by
      # reading CHANGELOG.md's dated release headings — deliberately not
      # `git tag`: on a pull_request ref the checkout action fetches
      # --depth=1 with no tags and ignores the fetch-tags input in that mode,
      # which turned this job red on the #858 review's first two CI runs. The
      # version is deliberately unnamed here: the shallow-and-tagless default
      # has survived every major bump of the action, so naming one only goes
      # stale the next time the pin moves.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check file sizes
        run: python scripts/checks/file_size.py --strict

  licenses:
    name: Third-party license check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@latest

      - name: Cache cargo-deny
        id: cache-cargo-deny
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-deny-0.19.0

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.19.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          cd agents && pip install -e ".[dev]"

      - name: Check Go licenses
        run: make check-licenses-go

      - name: Check Python licenses
        run: make check-licenses-python

      - name: Check Rust licenses
        run: make check-licenses-rust
