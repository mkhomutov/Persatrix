# CI pipeline for Orchestr8.
#
# PR review: the Makefile defines test, lint, and validate targets but no CI
# ran them, meaning PRs could merge with broken imports, syntax errors, or
# failing validation. This workflow runs the core checks on every PR and push
# to main.
#
# Scope: Go build+test, Python lint+test, Rust build+clippy, config validation.
# Proto generation and Docker builds are excluded — they require external
# tooling (protoc, Docker) that adds complexity without scaffold-stage value.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build orchestrator
        run: go build ./cmd/orchestrator

      - name: Run Go tests
        run: go test ./internal/... -v -race -cover

  python:
    name: Python (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd agents && pip install -e ".[dev]"

      - name: Lint with ruff
        run: cd agents && ruff check .

      - name: Type check with mypy
        run: cd agents && mypy .
        continue-on-error: true  # scaffold has many stubs; enforce once implemented

      - name: Run unit tests
        run: python -m pytest tests/unit/python/ -v --tb=short

  rust:
    name: Rust (build + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Build CLI
        run: cd cli && cargo build

      - name: Clippy
        run: cd cli && cargo clippy -- -D warnings

  validate:
    name: Validate configs
    runs-on: ubuntu-latest
    needs: [python]  # needs agent deps installed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd agents && pip install -e ".[dev]"

      - name: Validate YAML configs
        run: python -m orchestr8_agents.validate config/
        continue-on-error: true  # validator intentionally fails in scaffold
