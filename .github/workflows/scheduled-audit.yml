name: Scheduled Dependency Audit

# Reads the published security advisories for everything the project installs:
# the Rust CLI's crates, the Go modules, CI's Python pins and the web console's
# npm packages. Until 2026-11 it read them for the Rust CLI only (ISSUE-0218).
#
# One audit failing does not stop the others: no step after the checkout
# waits for the steps before it to pass (`!cancelled()` in every `if`), so one
# Monday shows all four results. A failed step still fails the job, and that
# is what makes the last step open or update the "Scheduled Dependency Audit
# Failure" issue, which names the audits that failed and the command each one
# ran.
#
# An audit does wait for one thing: the steps that install what it runs with.
# If one of those fails, the audit is skipped and the issue says it did not
# run, and why. Without that, the audit ran with whatever the runner had (its
# own Go, or no uv at all), failed, and the issue blamed a dependency.
# tests/unit/python/test_scheduled_audit.py holds the steps, and
# test_scheduled_audit_issue.py beside it the text of the issue.
#
# A finding is fixed by a change of its own, never in this workflow.

on:
  schedule:
    # Run every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-audit:
    name: Weekly Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        id: checkout

      # ─── Rust CLI: cargo-deny ───────────────────────────────
      # The toolchain CI uses, from cli/rust-toolchain.toml. Run in cli/,
      # `rustup toolchain install` with no name installs what that file names.
      - name: Install the Rust toolchain pinned in cli/rust-toolchain.toml
        id: setup-rust
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        working-directory: cli
        run: rustup toolchain install --no-self-update

      - name: Cache cargo-deny
        id: cache-cargo-deny
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-deny
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ runner.os }}-cargo-deny-0.19.0

      # From cli/, so rustup builds it with the pinned toolchain. Skipped
      # when the cache already holds it.
      - name: Install cargo-deny
        id: setup-cargo-deny
        if: ${{ !cancelled() && steps.setup-rust.outcome == 'success' && steps.cache-cargo-deny.outputs.cache-hit != 'true' }}
        working-directory: cli
        run: cargo install cargo-deny --locked --version 0.19.0

      # `-D advisory-not-detected` fails the audit on an ignore in deny.toml
      # that no longer matches any crate, so a stale exception is caught the
      # week it goes stale. Without it that is only a warning: the RUSTSEC-2026-0173
      # ignore matched nothing from 2026-09-25 through three green runs, and
      # was noticed only when other advisories failed the run (#1043).
      - name: Audit the Rust CLI's crates (cargo-deny)
        id: audit-rust
        if: ${{ !cancelled() && steps.setup-rust.outcome == 'success' && (steps.setup-cargo-deny.outcome == 'success' || steps.cache-cargo-deny.outputs.cache-hit == 'true') }}
        working-directory: cli
        run: cargo deny check -D advisory-not-detected advisories bans sources licenses

      # ─── Go modules: govulncheck ────────────────────────────
      # govulncheck judges the standard library by the Go release it runs on,
      # so the release decides the answer. This is the Go the orchestrator
      # image is built with: the newest patch release of the line its base tag
      # names (`FROM golang:<line>-alpine` in Dockerfile.orchestrator). CI's
      # other jobs build with exactly the release go.mod names, the oldest one
      # supported: on that one govulncheck lists every standard-library fix
      # shipped since (37 on 2026-11-14), and no dependency bump clears one.
      - name: Read the Go line the orchestrator image builds with
        id: go-line
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          line=$(sed -n 's/^FROM golang:\([0-9][0-9]*\.[0-9][0-9]*\).* AS builder.*/\1/p' Dockerfile.orchestrator)
          test -n "$line"
          echo "line=$line" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v7
        id: setup-go
        if: ${{ !cancelled() && steps.go-line.outcome == 'success' }}
        with:
          go-version: ${{ steps.go-line.outputs.line }}
          check-latest: true

      # It fails when the orchestrator's code reaches a vulnerable function.
      # A vulnerability in a module the code requires and never calls is
      # printed and does not fail the run. No `-test`: what ships, not its
      # tests. govulncheck has no ignore list, so a finding is cleared by a
      # bump or not at all.
      - name: Audit the Go modules (govulncheck)
        id: audit-go
        if: ${{ !cancelled() && steps.setup-go.outcome == 'success' }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      # ─── Python pins: pip-audit ─────────────────────────────
      # pip-audit reads the pins as they are written: `--no-deps` resolves
      # nothing and needs every line pinned with `==`, which is how uv writes
      # the file, and `--disable-pip` builds no environment. So it audits what
      # CI installs, on the Python CI runs. It says nothing about a pin whose
      # marker is false there, and drops it without a word: a pin for another
      # platform (colorama, on Windows) and a pin for another Python (one
      # written `python_full_version >= '3.12'`). Auditing the other Pythons
      # goes with the choice of which Python the agent image runs
      # (ISSUE-0219). The loop takes in every constraints file, and goes on to
      # the next one after a finding.
      - uses: actions/setup-python@v7
        id: setup-python
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          python-version: "3.11"

      - name: Install the pinned uv
        id: setup-uv
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: make uv-install

      - name: Audit the Python pins (pip-audit)
        id: audit-python
        if: ${{ !cancelled() && steps.setup-python.outcome == 'success' && steps.setup-uv.outcome == 'success' }}
        run: |
          status=0
          for file in .github/python-constraints*.txt; do
            echo "== pip-audit $file"
            uv tool run --python 3.11 --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r "$file" || status=1
          done
          exit "$status"

      # ─── Web console packages: npm audit ────────────────────
      # npm audit reads web/package-lock.json and asks the registry; with
      # `--package-lock-only` nothing is installed. Development dependencies
      # count, because the console has no others: Svelte and Vite build the
      # bundle the orchestrator embeds, so leaving them out would audit nothing.
      # It fails from "moderate" up. Every advisory ISSUE-0087 recorded was
      # moderate or above and had a fix. A "low" one is printed and does not
      # fail the run: npm audit cannot accept one advisory by name, and two
      # with no fix available were open on 2026-11-14, which would have made
      # every Monday red with nothing to do about it. The Node release, and so
      # the npm, is the one CI's web-console job installs.
      - uses: actions/setup-node@v7
        id: setup-node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        with:
          node-version: "22.22.2"

      - name: Audit the web console's packages (npm audit)
        id: audit-web
        if: ${{ !cancelled() && steps.setup-node.outcome == 'success' }}
        working-directory: web
        run: npm audit --package-lock-only --audit-level=moderate

      # ─── Report ─────────────────────────────────────────────
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        env:
          AUDIT_RUST: ${{ steps.audit-rust.outcome }}
          AUDIT_GO: ${{ steps.audit-go.outcome }}
          AUDIT_PYTHON: ${{ steps.audit-python.outcome }}
          AUDIT_WEB: ${{ steps.audit-web.outcome }}
          SETUP_CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP_RUST: ${{ steps.setup-rust.outcome }}
          SETUP_CARGO_DENY: ${{ steps.setup-cargo-deny.outcome }}
          SETUP_GO_LINE: ${{ steps.go-line.outcome }}
          SETUP_GO: ${{ steps.setup-go.outcome }}
          SETUP_PYTHON: ${{ steps.setup-python.outcome }}
          SETUP_UV: ${{ steps.setup-uv.outcome }}
          SETUP_NODE: ${{ steps.setup-node.outcome }}
        with:
          script: |
            const title = 'Scheduled Dependency Audit Failure';
            const runDate = new Date().toISOString().split('T')[0];
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            // One entry per audit step. `rerun` is the command that step
            // runs, so the same line works on a contributor's machine.
            const audits = [
              {
                name: 'Rust CLI crates (cargo-deny)',
                outcome: process.env.AUDIT_RUST,
                rerun: 'cd cli && cargo deny check -D advisory-not-detected advisories bans sources licenses',
                fix: 'Update the crate in `cli/Cargo.lock`, or add an ignore with its reason to `deny.toml`.',
              },
              {
                name: 'Go modules (govulncheck)',
                outcome: process.env.AUDIT_GO,
                rerun: 'go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...',
                fix: 'Update the module in `go.mod`; govulncheck has no ignore list. Run the command on the newest patch release of the Go line `Dockerfile.orchestrator` builds with, as this workflow does: an older Go also reports the standard-library advisories its later patch releases fixed.',
              },
              {
                name: 'Python pins (pip-audit)',
                outcome: process.env.AUDIT_PYTHON,
                rerun: 'for file in .github/python-constraints*.txt; do uv tool run --python 3.11 --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r "$file"; done',
                fix: 'Raise the floor of the affected package in `agents/pyproject.toml` to the fixed release, then run `make python-constraints`: it moves that package and what must move with it, and keeps every other pin. `make python-constraints-upgrade` and the weekly constraints refresh move every pin at once, so they are held whenever any check fails on the newest releases. If a range in `agents/pyproject.toml` rules the fixed release out, widen the range first.',
              },
              {
                name: 'Web console packages (npm audit)',
                outcome: process.env.AUDIT_WEB,
                rerun: 'cd web && npm audit --package-lock-only --audit-level=moderate',
                fix: 'Update the package in `web/package.json` and `web/package-lock.json`. The run fails from "moderate" up; a "low" advisory is in the log only.',
              },
            ];

            // The steps that install what the audits run with. An audit
            // whose set-up failed is skipped, so it shows below as not run.
            const setups = [
              { name: 'the checkout', outcome: process.env.SETUP_CHECKOUT },
              { name: 'the Rust toolchain', outcome: process.env.SETUP_RUST },
              { name: 'cargo-deny', outcome: process.env.SETUP_CARGO_DENY },
              { name: 'the Go line read from `Dockerfile.orchestrator`', outcome: process.env.SETUP_GO_LINE },
              { name: 'Go', outcome: process.env.SETUP_GO },
              { name: 'Python', outcome: process.env.SETUP_PYTHON },
              { name: 'uv', outcome: process.env.SETUP_UV },
              { name: 'Node', outcome: process.env.SETUP_NODE },
            ];

            const word = (outcome) =>
              outcome === 'success' ? 'passed' : outcome === 'failure' ? '**FAILED**' : 'did not run';
            const failed = audits.filter((a) => a.outcome === 'failure');
            const brokenSetups = setups.filter((s) => s.outcome === 'failure');

            let summary = audits.map((a) => `- ${a.name}: ${word(a.outcome)}`).join('\n');
            if (brokenSetups.length > 0) {
              summary += `\n\n**Set-up failed: ${brokenSetups.map((s) => s.name).join(', ')}.** An audit shown above as "did not run" was not judged: that is a fault of the run, not a finding in a dependency. Read the log, then run the workflow again from the Actions tab.`;
            } else if (failed.length === 0) {
              summary += '\n\nNo audit and no set-up step failed, so another step did (the cargo-deny cache, or this report). Read the log.';
            }
            const details = failed
              .map((a) => `### ${a.name}\n\nRe-run it locally from the repository root:\n\n\`\`\`sh\n${a.rerun}\n\`\`\`\n\n${a.fix}`)
              .join('\n\n');

            const body = `The weekly dependency audit failed (run date: ${runDate}, [run ${context.runId}](${runUrl})).

            ${summary}

            ${details}
            `;

            // Check if an open issue already exists with this title
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `## New Audit Failure (${runDate})\n\n${body}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'dependencies', 'automated']
              });
            }
