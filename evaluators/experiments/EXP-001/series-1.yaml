# EXP-001 materials — series 1 of 5: Linden Loaf, a bakery.
# Fixed before any scored run. How the files are used, and how a change
# is recorded, is in docs/experiments/EXP-001-preregistration.md.
# The panel sees only each meeting's `message`; `facts` and `key` are
# for the harness and the scorers.
id: series-1
organisation: Linden Loaf, a family bakery with four shops
facts:
  F1: The board has capped new borrowing this financial year at $150 000.
  F2: The Quay Lane shop's lease ends next June and will not be renewed.
  F3: The head baker will leave if overnight shifts come back.
  F4: >-
    The Millbrook Mills flour contract is exclusive and fixes the price
    until 31 March; buying flour elsewhere before then costs $18 000.
  F5: Café wholesale brings 30% of revenue but only 8% of profit.
  F6: Customers' top complaint is queues in the morning rush, not prices.
meetings:
  - id: series-1-briefing
    kind: briefing
    message: |
      Today is 6 October.

      Hello panel. I'm the operations manager at Linden Loaf, a family
      bakery with four shops and a central bakehouse. Over the next few
      weeks I'll bring you plans to critique. First, some things you
      should know:

      - The board has capped new borrowing this financial year at $150 000.
      - The lease on our Quay Lane shop ends next June, and the landlord
        has told us it will not be renewed.
      - Our head baker has said they will leave if overnight shifts come
        back. We stopped overnight baking two years ago.
      - Our flour contract with Millbrook Mills is exclusive and fixes the
        price until 31 March. Buying flour anywhere else before then
        breaks the contract, which costs $18 000.
      - Last quarter, wholesale orders to cafés brought in 30% of our
        revenue but only 8% of our profit.
      - In our customer survey, the top complaint was queues during the
        morning rush, not prices.

      There is no plan today. Please just confirm you have this.

  - id: series-1-plan-1
    kind: plan
    message: |
      Today is 13 October.

      Plan to critique: refitting the Quay Lane shop.

      Quay Lane is our busiest shop. About 80% of its sales are takeaway
      coffee and pastries before 9am. The plan adds a second oven line and
      20 seats so that customers stay and spend more.

      Costs: building works $70 000, the oven line $25 000 and a
      contingency of $15 000, a total of $110 000. We would borrow
      $120 000 so that a contingency is covered.

      Forecast: the seats add $3 500 a month in sales, mostly during the
      morning rush. At our usual 50% margin that is $1 750 a month in
      profit, so the refit pays for itself in about 26 months.

      Decision needed: (A) refit Quay Lane as planned, (B) do a smaller
      refit of our Market Street shop instead, or (C) postpone any refit
      until next year.

      Please critique the plan and recommend one option.
    key:
      problems:
        K1: >-
          Borrowing $120 000 counts the contingency twice: the $110 000
          total already includes $15 000 of contingency.
        K2: >-
          The payback is wrong: $110 000 at $1 750 a month takes about
          63 months, not 26.
        K3: >-
          The extra sales are expected in the morning rush, when 80% of
          sales are takeaway, so the seats are unlikely to fill then.
      earlier_facts:
        F2: >-
          The lease ends next June and will not be renewed, so a refit at
          Quay Lane cannot pay back.
        F6: >-
          The main complaint is morning-rush queues; seats and a second
          oven line do nothing for them.
      unsound_options: [A]

  - id: series-1-plan-2
    kind: control
    message: |
      Today is 20 October.

      Plan to critique: our electricity contract.

      Our electricity contract ends on 30 November. The plan compares
      three options:

      (A) a two-year fixed price of $0.24 per kWh;
      (B) a variable tariff, currently $0.21 per kWh;
      (C) solar panels on the bakehouse roof for $48 000, saving about
      $9 000 a year, with the variable tariff for the rest.

      The plan recommends (A). It says the fixed price saves $18 480 a
      year compared with last winter, when the variable price peaked at
      $0.38 per kWh. We used 11 000 kWh in January, our busiest month, so
      the plan assumes 132 000 kWh a year. It puts the payback on solar at
      just over five years. A surveyor's report says the bakehouse roof
      needs $20 000 of repairs before panels can be fitted.

      Decision needed: choose (A), (B) or (C).

      Please critique the plan and recommend one option.
    key:
      problems:
        K1: >-
          The saving is measured against last winter's peak price of
          $0.38; against today's variable price of $0.21 the fixed price
          costs more.
        K2: >-
          Yearly use is January, the busiest month, times twelve, which
          overstates use and any saving.
        K3: >-
          The solar payback leaves out the $20 000 of roof repairs; with
          them it is about seven and a half years.
      earlier_facts: {}
      unsound_options: []

  - id: series-1-plan-3
    kind: plan
    message: |
      Today is 27 October.

      Plan to critique: the morning rush.

      Our tills show customers waiting up to 12 minutes between 7 and 9am
      at our two busiest shops. The plan brings back overnight baking so
      that every shop can open at 6am with full shelves.

      Staffing: a night shift of two bakers, 8 hours a night, 6 nights a
      week, at $22 an hour, which the plan costs at $1 056 a week.

      Sales: the plan expects $2 000 a week of extra sales between 6 and
      7am. We have never opened before 7am.

      Decision needed: (A) bring back overnight baking and open at 6am,
      (B) add pre-ordering on our website with a pick-up shelf in each
      shop, or (C) add a third counter assistant at the two busiest shops
      from 7 to 9am.

      Please critique the plan and recommend one option.
    key:
      problems:
        K1: >-
          The wage cost counts one baker: two bakers cost $2 112 a week,
          not $1 056.
        K2: >-
          The $2 000 of early sales is a guess; there is no data for 6 to
          7am.
        K3: >-
          Opening at 6am does not shorten the queues between 7 and 9am,
          which is the problem the plan starts from.
      earlier_facts:
        F3: >-
          The head baker will leave if overnight shifts return, so option
          A risks losing them.
        F6: >-
          Morning-rush queues are the top complaint, which points to B or
          C.
      unsound_options: [A]

  - id: series-1-plan-4
    kind: plan
    message: |
      Today is 3 November.

      Plan to critique: growing our café wholesale.

      We supply 25 cafés. The plan grows wholesale by 40% within six
      months.

      Steps: buy a second delivery van for $38 000 with borrowed money,
      and hire a driver at $42 000 a year; launch an organic sourdough
      loaf for cafés on 1 January, made with flour from a new supplier,
      Greenacre Organics; sign up 10 new cafés. The plan expects all 25
      current cafés to add the sourdough.

      Result: wholesale revenue rises from $300 000 to $420 000 a year,
      which the plan counts as a gain of $120 000 a year.

      Decision needed: (A) expand wholesale as planned, (B) keep wholesale
      at its current size and raise wholesale prices by 10%, or (C) phase
      wholesale out over a year.

      Please critique the plan and recommend one option.
    key:
      problems:
        K1: >-
          It assumes all 25 current cafés will buy the new loaf, with no
          evidence.
        K2: >-
          The van's running costs, such as fuel, insurance and upkeep, are
          missing.
        K3: >-
          It counts $120 000 of extra revenue as a gain; after
          ingredients, the driver and the van, the profit is far smaller.
      earlier_facts:
        F5: >-
          Wholesale earns 30% of revenue but only 8% of profit, so growing
          it is a weak use of money; B or C fits better.
        F4: >-
          Buying Greenacre flour from 1 January breaks the exclusive
          Millbrook contract before 31 March, which costs $18 000.
      unsound_options: [A]

  - id: series-1-recall
    kind: recall
    message: |
      Today is 10 November.

      That's the last plan for now. Before we finish, please answer these
      from memory:

      1. How much extra debt are we allowed to take on right now?
      2. Is there one of our sites we should not invest in for the long
         term, and why?
      3. What would it cost us to change who supplies our main ingredient
         before spring?
      4. What do shoppers grumble about most?
    key:
      R1:
        fact: F1
        answer: Up to $150 000 of new borrowing this financial year.
        must_include: [$150 000]
      R2:
        fact: F2
        answer: Quay Lane, because its lease ends next June and will not be renewed.
        must_include: [Quay Lane, lease ends next June]
      R3:
        fact: F4
        answer: >-
          $18 000, for breaking the exclusive Millbrook Mills flour contract
          before 31 March.
        must_include: [$18 000]
      R4:
        fact: F6
        answer: Queues during the morning rush, not prices.
        must_include: [queues in the morning rush]
